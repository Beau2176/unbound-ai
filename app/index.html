<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>UNBOUND AI</title>

        <style>
            body {
                  margin: 0;
                        font-family: Arial, sans-serif;
                              background: #0b0b0f;
                                    color: white;
                                        }

                                            header {
                                                  padding: 18px;
                                                        text-align: center;
                                                              background: #12121a;
                                                                    border-bottom: 1px solid #333;
                                                                        }

                                                                            h1 {
                                                                                  margin: 0;
                                                                                        font-size: 28px;
                                                                                            }

                                                                                                .subtitle {
                                                                                                      color: #aaa;
                                                                                                            margin-top: 6px;
                                                                                                                }

                                                                                                                    .chat {
                                                                                                                          padding: 20px;
                                                                                                                                max-width: 900px;
                                                                                                                                      margin: auto;
                                                                                                                                          }

                                                                                                                                              .welcome {
                                                                                                                                                    background: #161620;
                                                                                                                                                          border: 1px solid #333;
                                                                                                                                                                border-radius: 14px;
                                                                                                                                                                      padding: 18px;
                                                                                                                                                                            margin-bottom: 18px;
                                                                                                                                                                                }

                                                                                                                                                                                    textarea {
                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                box-sizing: border-box;
                                                                                                                                                                                                      min-height: 110px;
                                                                                                                                                                                                            background: #15151d;
                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                        border: 1px solid #444;
                                                                                                                                                                                                                              border-radius: 12px;
                                                                                                                                                                                                                                    padding: 14px;
                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                resize: vertical;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                              margin-top: 12px;
                                                                                                                                                                                                                                                                    padding: 12px 22px;
                                                                                                                                                                                                                                                                          background: #7c3aed;
                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                  .response {
                                                                                                                                                                                                                                                        margin-top: 12px;
                                                                                                                                                                                                                                                              padding: 12px 14px;
                                                                                                                                                                                                                                                                    background: #12121a;
                                                                                                                                                                                                                                                                          border: 1px solid #333;
                                                                                                                                                                                                                                                                                border-radius: 10px;
                                                                                                                                                                                                                                                                                      color: #e5e7eb;
                                                                                                                                                                                                                                                                                            white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                              </head>

                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                              <header>
                                                                                                                                                                                                                                                                                                                <h1>UNBOUND AI</h1>
                                                                                                                                                                                                                                                                                                                  <div class="subtitle">Private. Powerful. User Controlled.</div>
                                                                                                                                                                                                                                                                                                                  </header>

                                                                                                                                                                                                                                                                                                                  <main class="chat">

                                                                                                                                                                                                                                                                                                                    <div class="welcome">
                                                                                                                                                                                                                                                                                                                        <h2>Welcome to UNBOUND AI</h2>
                                                                                                                                                                                                                                                                                                                            <p>Your AI workspace for open conversation, research, creativity and personalized AI modes.</p>
                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                <textarea id="message" placeholder="Ask UNBOUND AI anything..."></textarea>

                                                                                                                                                                                                                                                                                                                                  <button onclick="sendMessage()">Send</button>
                                                                                                                                                                                                                                                                                                                                  <div id="response" class="response" aria-live="polite"></div>

                                                                                                                                                                                                                                                                                                                                  </main>

                                                                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                                                                    async function sendMessage() {
                                                                                                                                                                                                                                                                                                                                        const message = document.getElementById("message").value;
                                                                                                                                                                                                                                                                                                                                        const responseBox = document.getElementById("response");

                                                                                                                                                                                                                                                                                                                                            if (!message.trim()) {
                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                              const response = await fetch("/api/chat", {
                                                                                                                                                                                                                                                                                                                                                                    method: "POST",
                                                                                                                                                                                                                                                                                                                                                                          headers: {
                                                                                                                                                                                                                                                                                                                                                                            "Content-Type": "application/json"
                                                                                                                                                                                                                                                                                                                                                                                  },
                                                                                                                                                                                                                                                                                                                                                                                        body: JSON.stringify({ message })
                                                                                                                                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                                                                                                                                              const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                              if (!response.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                throw new Error(data.error || "Request failed.");
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                    responseBox.textContent = data.reply || "No response returned.";
                                                                                                                                                                                                                                                                                                                                  } catch (error) {
                                                                                                                                                                                                                                                                                                                                      responseBox.textContent = error.message || "Something went wrong.";
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                            </html>
