<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050913" />
  <title>UNBOUND AI — Advertising Admin</title>
  <style>
    :root { --bg:#050913; --panel:#0a1220; --line:rgba(88,179,255,.28); --text:#f7fbff; --muted:#aab8c9; --blue:#42a5ff; --gold:#ffad43; --danger:#ff7676; --success:#65e8a4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#050913; }
    button, select { font:inherit; }
    :where(button,select,a[href]):focus-visible { outline:3px solid #ffd297; outline-offset:3px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px; border-bottom:1px solid rgba(255,255,255,.08); background:#08101d; }
    header h1 { margin:0; font-size:18px; }
    header a { color:#bfe4ff; text-decoration:none; font-size:12px; font-weight:800; }
    main { width:min(1180px,calc(100% - 28px)); margin:0 auto; padding:28px 0 60px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
    .toolbar p { margin:0; color:var(--muted); }
    .controls { display:flex; gap:8px; flex-wrap:wrap; }
    select,button { border:1px solid var(--line); border-radius:10px; background:#0a1627; color:white; padding:9px 11px; }
    button { cursor:pointer; font-weight:800; }
    button.primary { border-color:rgba(101,232,164,.4); background:rgba(33,122,76,.24); }
    button.danger { border-color:rgba(255,118,118,.4); background:rgba(120,24,32,.24); }
    button:disabled { cursor:not-allowed; opacity:.5; }
    .status { margin:10px 0 16px; color:var(--muted); font-size:12px; }
    .status.error { color:#ffc2c2; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:0 0 18px; }
    .metric { border:1px solid var(--line); border-radius:14px; background:#08111e; padding:16px; }
    .metric-label { color:var(--muted); font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .metric-value { margin-top:6px; font-size:28px; font-weight:950; }
    .metric-note { margin-top:4px; color:var(--muted); font-size:10px; }
    .orders { display:grid; gap:12px; }
    .order { border:1px solid var(--line); border-radius:16px; background:var(--panel); padding:18px; }
    .order-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .order h2 { margin:0 0 4px; font-size:18px; }
    .meta { color:var(--muted); font-size:11px; line-height:1.6; }
    .badges { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
    .badge { padding:5px 8px; border-radius:999px; border:1px solid var(--line); color:#cfeaff; font-size:9px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; }
    .badge.paid,.badge.approved { border-color:rgba(101,232,164,.35); color:#a9f3cb; }
    .badge.failed,.badge.rejected,.badge.refunded { border-color:rgba(255,118,118,.35); color:#ffc2c2; }
    .creative { margin-top:14px; padding:14px; border-radius:12px; background:#07101d; }
    .creative h3 { margin:0 0 6px; }
    .creative p { margin:0 0 8px; color:var(--muted); line-height:1.55; }
    .creative a { color:#bfe4ff; word-break:break-all; }
    .performance { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; color:#cfeaff; font-size:11px; font-weight:800; }
    .performance span { padding:6px 8px; border:1px solid rgba(88,179,255,.18); border-radius:9px; background:#081522; }
    .actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
    .empty { padding:26px; border:1px dashed var(--line); border-radius:14px; color:var(--muted); text-align:center; }
    @media (max-width:700px) { .metrics { grid-template-columns:1fr; } .order-head { flex-direction:column; } .badges { justify-content:flex-start; } }
  </style>
</head>
<body>
  <header>
    <h1>UNBOUND AI — Advertising Admin</h1>
    <a href="/admin.html">BACK TO ADMIN</a>
  </header>
  <main>
    <div class="toolbar">
      <p>Only paid and approved orders become public advertiser placements. Performance reporting is aggregate-only.</p>
      <div class="controls">
        <select id="windowDays" aria-label="Analytics window">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <select id="filter">
          <option value="all">All orders</option>
          <option value="pending">Pending review</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <button id="refresh" type="button">REFRESH</button>
      </div>
    </div>

    <section class="metrics" aria-label="Advertising performance summary">
      <div class="metric"><div class="metric-label">Impressions</div><div id="metricImpressions" class="metric-value">—</div><div class="metric-note">Advertiser cards served</div></div>
      <div class="metric"><div class="metric-label">Clicks</div><div id="metricClicks" class="metric-value">—</div><div class="metric-note">Tracked outbound visits</div></div>
      <div class="metric"><div class="metric-label">Click-through rate</div><div id="metricCtr" class="metric-value">—</div><div class="metric-note">Clicks ÷ impressions</div></div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="orders" class="orders"><div class="empty">Loading advertiser orders…</div></div>
  </main>
  <script>
    const ordersRoot = document.getElementById("orders");
    const statusRoot = document.getElementById("status");
    const filter = document.getElementById("filter");
    const windowDays = document.getElementById("windowDays");
    const refresh = document.getElementById("refresh");
    const metricImpressions = document.getElementById("metricImpressions");
    const metricClicks = document.getElementById("metricClicks");
    const metricCtr = document.getElementById("metricCtr");
    let metricsByOrder = new Map();

    function money(cents, currency) {
      return new Intl.NumberFormat(undefined,{style:"currency",currency:currency||"USD"}).format(Number(cents||0)/100);
    }

    function wholeNumber(value) {
      return new Intl.NumberFormat().format(Math.max(0,Number(value||0)));
    }

    function percent(value) {
      const number = Number(value || 0);
      return `${(Math.max(0, number) * 100).toFixed(2)}%`;
    }

    function badge(text, cls="") {
      const element = document.createElement("span");
      element.className = `badge ${cls}`.trim();
      element.textContent = text;
      return element;
    }

    async function reviewOrder(id, action) {
      statusRoot.className = "status";
      statusRoot.textContent = `${action === "approve" ? "Approving" : "Rejecting"} order…`;
      const response = await fetch(`/api/admin/advertising/orders/${encodeURIComponent(id)}/review`, {
        method:"POST",
        credentials:"same-origin",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({action})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Could not review advertiser order.");
      statusRoot.textContent = action === "approve" ? "Advertiser approved and scheduled." : "Advertiser rejected.";
      await refreshAll();
    }

    function renderOrders(orders) {
      ordersRoot.innerHTML = "";
      if (!orders.length) {
        ordersRoot.innerHTML = '<div class="empty">No advertiser orders match this view.</div>';
        return;
      }
      for (const order of orders) {
        const card = document.createElement("article");
        card.className = "order";

        const head = document.createElement("div");
        head.className = "order-head";
        const copy = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = order.businessName;
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `Order #${order.id} • ${order.packageName} • ${money(order.amountCents, order.currency)} • ${order.durationDays} days • ${order.contactEmail}`;
        copy.append(title,meta);
        const badges = document.createElement("div");
        badges.className = "badges";
        badges.append(badge(order.paymentStatus, order.paymentStatus), badge(order.reviewStatus, order.reviewStatus));
        if (order.featured) badges.append(badge("featured"));
        head.append(copy,badges);

        const creative = document.createElement("div");
        creative.className = "creative";
        const headline = document.createElement("h3");
        headline.textContent = order.headline;
        const description = document.createElement("p");
        description.textContent = order.description;
        const link = document.createElement("a");
        link.href = order.websiteUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = order.websiteUrl;
        creative.append(headline,description,link);

        const metric = metricsByOrder.get(String(order.id)) || { impressions:0, clicks:0, clickThroughRate:0 };
        const performance = document.createElement("div");
        performance.className = "performance";
        const impressions = document.createElement("span");
        impressions.textContent = `${wholeNumber(metric.impressions)} impressions`;
        const clicks = document.createElement("span");
        clicks.textContent = `${wholeNumber(metric.clicks)} clicks`;
        const ctr = document.createElement("span");
        ctr.textContent = `${percent(metric.clickThroughRate)} CTR`;
        performance.append(impressions,clicks,ctr);

        const actions = document.createElement("div");
        actions.className = "actions";
        const approve = document.createElement("button");
        approve.type = "button";
        approve.className = "primary";
        approve.textContent = "APPROVE";
        approve.disabled = order.paymentStatus !== "paid" || order.reviewStatus === "approved";
        approve.addEventListener("click", () => reviewOrder(order.id,"approve").catch(showError));
        const reject = document.createElement("button");
        reject.type = "button";
        reject.className = "danger";
        reject.textContent = "REJECT";
        reject.disabled = order.reviewStatus === "rejected";
        reject.addEventListener("click", () => reviewOrder(order.id,"reject").catch(showError));
        actions.append(approve,reject);

        card.append(head,creative,performance,actions);
        ordersRoot.appendChild(card);
      }
    }

    function showError(error) {
      statusRoot.className = "status error";
      statusRoot.textContent = error.message || "Advertising admin request failed.";
    }

    async function loadMetrics() {
      const days = Number.parseInt(windowDays.value,10) || 30;
      const response = await fetch(`/api/admin/advertising/metrics?days=${encodeURIComponent(days)}`, {
        credentials:"same-origin",
        headers:{"Accept":"application/json"}
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Could not load advertising metrics.");
      metricsByOrder = new Map((Array.isArray(data.orders) ? data.orders : []).map((item) => [String(item.id),item]));
      metricImpressions.textContent = wholeNumber(data.totals?.impressions);
      metricClicks.textContent = wholeNumber(data.totals?.clicks);
      metricCtr.textContent = percent(data.totals?.clickThroughRate);
    }

    async function loadOrders() {
      statusRoot.className = "status";
      statusRoot.textContent = "Loading advertiser orders…";
      const query = filter.value === "all" ? "" : `?reviewStatus=${encodeURIComponent(filter.value)}`;
      const response = await fetch(`/api/admin/advertising/orders${query}`, {
        credentials:"same-origin",
        headers:{"Accept":"application/json"}
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Could not load advertiser orders.");
      renderOrders(Array.isArray(data.orders) ? data.orders : []);
      statusRoot.textContent = `${data.orders?.length || 0} advertiser order(s). Analytics window: ${windowDays.value} days.`;
    }

    async function refreshAll() {
      await loadMetrics();
      await loadOrders();
    }

    refresh.addEventListener("click", () => refreshAll().catch(showError));
    filter.addEventListener("change", () => loadOrders().catch(showError));
    windowDays.addEventListener("change", () => refreshAll().catch(showError));
    refreshAll().catch(showError);
  </script>
</body>
</html>
