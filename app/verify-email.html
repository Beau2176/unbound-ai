<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050913" />
  <meta name="referrer" content="no-referrer" />
  <title>Verify Email — UNBOUND AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050913;
      --panel: rgba(5, 10, 20, 0.94);
      --line: rgba(88, 179, 255, 0.42);
      --text: #f7fbff;
      --muted: #aab8c9;
      --blue: #6bc1ff;
      --gold: #ffad43;
      --good: #65e8a4;
      --bad: #ff8a8a;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(2, 6, 14, 0.32), rgba(2, 6, 14, 0.92)),
        url("/unbound-cosmic.png") center / cover fixed no-repeat,
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .mark {
      margin: 0 auto 18px;
      font-size: 40px;
      line-height: 1;
      color: var(--blue);
      text-shadow: 0 0 26px rgba(107, 193, 255, 0.5);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 38px);
      letter-spacing: 0.02em;
    }

    .brand {
      margin-top: 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.2em;
    }

    #message {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    #message.good { color: var(--good); }
    #message.bad { color: var(--bad); }

    a {
      display: inline-flex;
      margin-top: 24px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border: 1px solid rgba(107, 193, 255, 0.48);
      border-radius: 12px;
      background: rgba(66, 165, 255, 0.12);
      color: #e9f7ff;
      font-weight: 800;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #ffd297;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">∞</div>
    <h1>Verify your email</h1>
    <div class="brand">UNBOUND AI</div>
    <p id="message" role="status" aria-live="polite">Checking your verification link…</p>
    <a href="/" id="homeLink" hidden>Return to UNBOUND AI</a>
  </main>

  <script>
    (() => {
      "use strict";

      const message = document.getElementById("message");
      const homeLink = document.getElementById("homeLink");
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const token = fragment.get("token") || "";

      // Remove the secret from the visible URL and browser history before any network request.
      history.replaceState(null, "", window.location.pathname);

      function finish(text, state) {
        message.textContent = text;
        message.className = state;
        homeLink.hidden = false;
      }

      if (!token || token.length > 512) {
        finish("This verification link is invalid or has expired. Sign in to request a new one.", "bad");
        return;
      }

      fetch("/api/email-verification/consume", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      })
        .then(async (response) => {
          let data = {};
          try {
            data = await response.json();
          } catch {
            // Use the generic message below.
          }

          if (!response.ok || data?.verification?.verified !== true) {
            throw new Error("verification-failed");
          }

          finish("Your email is verified. You can return to UNBOUND AI.", "good");
        })
        .catch(() => {
          finish("This verification link is invalid or has expired. Sign in to request a new one.", "bad");
        });
    })();
  </script>
</body>
</html>
