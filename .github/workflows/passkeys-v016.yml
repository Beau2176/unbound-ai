name: Passkeys v0.16

on:
  push:
    branches:
      - passkeys-v0.16

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply passkey migrations
        run: |
          python scripts/fix-passkey-health-matcher-v016.py
          python scripts/migrate-passkeys-server-v016.py
          python scripts/migrate-passkeys-index-v016.py
      - name: Install pinned WebAuthn verifier
        working-directory: app
        run: npm install @simplewebauthn/server@14.0.1 --save-exact
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/passkeys.js
          node --check app/security/rate-limit.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify WebAuthn gateway contract
        working-directory: app
        run: |
          node - <<'NODE'
          (async () => {
            const passkeys = require('./security/passkeys');
            const status = passkeys.getPasskeyStatus({ PORT: '3000' });
            if (!status.enabled || status.rpID !== 'localhost') process.exit(1);
            if (status.biometricDataStored !== false || status.privateKeysStored !== false) process.exit(1);
            if (status.userVerification !== 'required') process.exit(1);
            const options = await passkeys.generateAuthentication();
            if (!options.challenge || options.userVerification !== 'required') process.exit(1);
            if (!Array.isArray(options.allowCredentials) || options.allowCredentials.length !== 0) process.exit(1);
            console.log('Passkey gateway contract OK');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Verify database and replay protection
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_passkey_user_handles' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS account_passkeys' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS passkey_challenges' app/server.js
          grep -q 'DELETE FROM passkey_challenges' app/server.js
          grep -q 'consumePasskeyChallenge' app/server.js
          grep -q 'clearPasskeyFlowCookie' app/server.js
          grep -q 'signature_counter' app/server.js
          grep -q 'public_key BYTEA NOT NULL' app/server.js
          if grep -Eiq 'biometric_(data|template|hash)|fingerprint_(data|template|hash)|face_(scan|template|hash)' app/server.js; then
            echo 'Biometric persistence field detected.'
            exit 1
          fi
      - name: Verify passkey routes and UI
        run: |
          grep -q '"/api/auth/passkey/options"' app/server.js
          grep -q '"/api/auth/passkey/verify"' app/server.js
          grep -q '"/api/account/passkeys/register/options"' app/server.js
          grep -q '"/api/account/passkeys/register/verify"' app/server.js
          grep -q '"/api/account/passkeys/:id"' app/server.js
          grep -q 'passkeyLoginButton' app/index.html
          grep -q 'navigator.credentials.get' app/index.html
          grep -q 'navigator.credentials.create' app/index.html
          grep -q 'ADD PASSKEY' app/index.html
          grep -q 'passkeyAuth' app/security/rate-limit.js
      - name: Verify earlier security layers survived
        run: |
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'rate_limit_buckets' app/server.js
          grep -q 'account_devices' app/server.js
          grep -q 'account_security_events' app/server.js
          grep -q 'clearGuestRateCookie' app/server.js
          grep -q 'getAgeVerificationGatewayStatus' app/server.js
          grep -q 'getBillingGatewayStatus' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/package.json app/package-lock.json
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add WebAuthn passkey authentication and management"
            git push origin HEAD:passkeys-v0.16
          fi
