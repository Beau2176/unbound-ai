name: Unbound Mode v0.21

on:
  push:
    branches:
      - unbound-mode-v0.21

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply Unbound Mode migration
        run: python scripts/migrate-unbound-mode-v021.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify Unbound Mode entitlement
        working-directory: app
        run: |
          node - <<'NODE'
          const e = require('./access/entitlements');
          const mode = e.CAPABILITY_CATALOG.unbound_mode;
          if (!mode || mode.implemented !== true || mode.minimumPlan !== 'free') process.exit(1);
          const access = e.buildCapabilityAccess({ planTier: 'free' });
          const item = access.find((x) => x.key === 'unbound_mode');
          if (!item || !item.usable) process.exit(1);
          const disabled = e.buildCapabilityAccess({
            planTier: 'free',
            overrides: [{ key: 'unbound_mode', enabled: false }]
          }).find((x) => x.key === 'unbound_mode');
          if (!disabled || disabled.usable) process.exit(1);
          console.log('Unbound entitlement contract OK');
          NODE
      - name: Verify Unbound Mode server wiring
        run: |
          grep -q 'const UNBOUND_MODE_PROMPT' app/server.js
          grep -q 'normalized === "unbound"' app/server.js
          grep -q 'productMode === "unbound"' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "unbound_mode")' app/server.js
          grep -q 'UNBOUND_MODE_PROMPT' app/server.js
          grep -q 'Keep the platform.*core safety boundaries' app/server.js
      - name: Verify Unbound Mode UI
        run: |
          grep -q 'id="unboundModeButton"' app/index.html
          grep -q 'data-product-mode="unbound"' app/index.html
          grep -q 'Unbound Mode — Candid, direct conversation' app/index.html
          grep -q 'unbound_mode' app/index.html
          grep -q 'setProductMode("unbound"' app/index.html
      - name: Verify Creative Research and security layers survived
        run: |
          grep -q 'creative_mode' app/access/entitlements.js
          grep -q 'web_research' app/access/entitlements.js
          grep -q 'const CREATIVE_MODE_PROMPT' app/server.js
          grep -q 'const RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'account_security_alerts' app/server.js
          grep -q 'auth.repeated_failed_sign_in' app/server.js
          grep -q 'account_recovery_codes' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/access/entitlements.js
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add Unbound Mode"
            git push origin HEAD:unbound-mode-v0.21
          fi
