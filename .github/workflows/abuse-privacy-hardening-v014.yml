name: Abuse protection privacy hardening v0.14

on:
  push:
    branches:
      - abuse-protection-v0.14

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply deletion privacy hardening
        run: python scripts/harden-abuse-privacy-v014.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/rate-limit.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/admin.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('admin script block missing')
          Path('/tmp/unbound-admin.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-admin.js
      - name: Verify deletion clears all browser identifiers
        run: |
          grep -q 'function clearGuestRateCookie' app/server.js
          python - <<'PY'
          from pathlib import Path
          s = Path('app/server.js').read_text()
          route = s.split('app.delete(\n  "/api/account",', 1)[1].split('/* ------------------------- CONVERSATION HISTORY', 1)[0]
          for call in ['clearSessionCookie(res);', 'clearDeviceCookie(res);', 'clearGuestRateCookie(res);']:
              if call not in route:
                  raise SystemExit(f'Missing deletion cleanup: {call}')
          print('Account deletion clears session, device, and guest limiter cookies.')
          PY
      - name: Verify abuse controls remain wired
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS rate_limit_buckets' app/server.js
          grep -q 'app.post("/api/chat", chatRateLimit, researchRateLimit' app/server.js
          grep -q 'app.post("/api/chat/stream", chatRateLimit' app/server.js
          grep -q '"/api/admin/rate-limits/summary"' app/server.js
          grep -q 'id="refreshAbuseProtection"' app/admin.html
          if grep -Eiq 'ip_address|remote_addr|client_ip|last_ip' app/server.js; then
            echo 'Raw IP persistence field detected.'
            exit 1
          fi
      - name: Verify previous security features survived
        run: |
          grep -q '"/api/account/security/events"' app/server.js
          grep -q '"/api/account/devices/:id/revoke"' app/server.js
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q 'RESEARCH_MODE_PROMPT' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit hardened production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js
          if git diff --cached --quiet; then
            echo "No hardening change to commit."
            exit 0
          fi
          git commit -m "Clear guest rate token on account deletion"
          git push
