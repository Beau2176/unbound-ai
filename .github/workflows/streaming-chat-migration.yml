name: Streaming chat migration

on:
  push:
    branches:
      - streaming-chat-v0.6

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply streaming migration
        run: node scripts/migrate-streaming-chat.js
      - name: Validate server and provider syntax
        run: |
          node --check app/server.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('script block not found')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Validate streaming wiring
        run: |
          grep -q 'app.post("/api/chat/stream"' app/server.js
          grep -q 'fetch("/api/chat/stream"' app/index.html
          grep -q 'response.output_text.delta' app/ai/providers/openai.js
          grep -q 'stream: true' app/ai/providers/openai.js
          AI_PROVIDER=openai node -e 'const g=require("./app/ai/gateway"); const s=g.getGatewayStatus(); if(s.streaming!==true) process.exit(1); console.log(JSON.stringify(s))'
      - name: Commit migrated source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No source migration changes to commit."
            exit 0
          fi
          git commit -m "Add streaming chat response path"
          git push
