name: Adult Mode v0.22

on:
  push:
    branches:
      - adult-mode-v0.22

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply Adult Mode migration
        run: python scripts/migrate-adult-mode-v022.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
          node --check app/age/gateway.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify Adult Mode entitlement and age primitive
        working-directory: app
        run: |
          node - <<'NODE'
          const e = require('./access/entitlements');
          const age = require('./age/gateway');
          const mode = e.CAPABILITY_CATALOG.adult_mode;
          if (!mode || mode.implemented !== true || mode.minimumPlan !== 'free') process.exit(1);
          if (!age.ageVerificationAllowsAdultAccess('verified')) process.exit(1);
          if (age.ageVerificationAllowsAdultAccess('unverified')) process.exit(1);
          if (age.ageVerificationAllowsAdultAccess('verified', '2000-01-01T00:00:00Z')) process.exit(1);
          const gateway = age.getAgeVerificationGatewayStatus({});
          if (gateway.configured !== false || gateway.minimumAge !== 18) process.exit(1);
          console.log('Adult Mode entitlement and age primitive contract OK');
          NODE
      - name: Verify server-side Adult Mode gate
        run: |
          grep -q 'const ADULT_MODE_PROMPT' app/server.js
          grep -q 'normalized === "adult"' app/server.js
          test "$(grep -c 'productMode === "adult"' app/server.js)" -ge 4
          test "$(grep -c 'assertAgeVerifiedAdult(req)' app/server.js)" -ge 2
          test "$(grep -c 'assertRequestCapability(req, "adult_mode")' app/server.js)" -ge 2
          grep -q 'hard-age-verification-required' app/server.js
          grep -q 'ageVerificationGateway' app/server.js
          grep -q 'Keep firm boundaries around exploitation, trafficking, coercion' app/server.js
      - name: Verify streaming mode persistence fix
        run: |
          grep -q 'eventType: "chat_stream_" + productMode + "_" + depthStyle' app/server.js
          python - <<'PY'
          from pathlib import Path
          text = Path('app/server.js').read_text()
          start = text.index('app.post("/api/chat/stream"')
          end = text.index('\napp.get("/",', start)
          stream = text[start:end]
          required = [
              'depthStyle,\n      productMode\n    );',
              'productMode,\n      provider: gatewayStatus.provider',
              'depthStyle,\n        productMode,\n        { sources:',
              'eventType: "chat_stream_" + productMode + "_" + depthStyle',
          ]
          for item in required:
              if item not in stream:
                  raise SystemExit('stream persistence contract missing: ' + repr(item))
          if 'productMode: "standard"' in stream or 'chat_stream_standard_' in stream:
              raise SystemExit('stream route still hard-codes Standard Mode')
          print('Streaming product-mode persistence contract OK')
          PY
      - name: Verify Adult Mode UI lock and visibility
        run: |
          grep -q 'id="adultModeButton"' app/index.html
          grep -q 'data-product-mode="adult"' app/index.html
          grep -q 'Adult Mode — Verified 18+ mature conversation' app/index.html
          grep -q 'Hard 18+ verification' app/index.html
          grep -q 'PROVIDER NOT CONNECTED' app/index.html
          grep -q 'chooseAdultMode' app/index.html
          grep -q 'adult_mode' app/index.html
          grep -q 'hard 18+ verification provider is connected' app/index.html
      - name: Verify prior modes and security survived
        run: |
          grep -q 'const UNBOUND_MODE_PROMPT' app/server.js
          grep -q 'const CREATIVE_MODE_PROMPT' app/server.js
          grep -q 'const RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'unbound_mode' app/access/entitlements.js
          grep -q 'creative_mode' app/access/entitlements.js
          grep -q 'web_research' app/access/entitlements.js
          grep -q 'account_security_alerts' app/server.js
          grep -q 'auth.repeated_failed_sign_in' app/server.js
          grep -q 'account_recovery_codes' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/access/entitlements.js
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add hard-gated Adult Mode and fix streaming mode persistence"
            git push origin HEAD:adult-mode-v0.22
          fi
