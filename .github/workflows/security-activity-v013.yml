name: Security activity v0.13

on:
  push:
    branches:
      - security-activity-v0.13

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply security activity migration
        run: python scripts/migrate-security-activity-v013.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'admin.html']:
              html = Path('app', name).read_text()
              start = html.rfind('<script>')
              end = html.rfind('</script>')
              if start < 0 or end <= start:
                  raise SystemExit(f'{name}: script block missing')
              Path(f'/tmp/{name}.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/index.html.js
          node --check /tmp/admin.html.js
      - name: Verify user security activity
        run: |
          grep -q '"/api/account/security/events"' app/server.js
          grep -q 'function publicSecurityEvent' app/server.js
          grep -q 'id="securityEventList"' app/index.html
          grep -q 'loadSecurityEvents' app/index.html
          grep -q 'Recent security activity' app/index.html
      - name: Verify security operations admin summary
        run: |
          grep -q '"/api/admin/security/summary"' app/server.js
          grep -q 'id="securityOperationsBody"' app/admin.html
          grep -q 'loadSecurityOperations' app/admin.html
          grep -q 'Security Operations' app/admin.html
      - name: Verify account deletion clears device identifier
        run: |
          grep -q 'function clearDeviceCookie' app/server.js
          python - <<'PY'
          from pathlib import Path
          s = Path('app/server.js').read_text()
          route = s.split('app.delete(\n  "/api/account",', 1)[1].split('/* ------------------------- CONVERSATION HISTORY', 1)[0]
          if 'clearSessionCookie(res);' not in route or 'clearDeviceCookie(res);' not in route:
              raise SystemExit('Permanent account deletion does not clear both session and device cookies.')
          print('Account-deletion cookie cleanup verified.')
          PY
      - name: Verify privacy boundary
        run: |
          if grep -Eiq 'ip_address|remote_addr|client_ip|last_ip' app/server.js; then
            echo 'IP persistence field detected.'
            exit 1
          fi
          grep -q 'device_token_hash TEXT NOT NULL' app/server.js
          grep -q 'provider_reference_hash TEXT' app/server.js
      - name: Verify previous controls survived
        run: |
          grep -q '"/api/account/devices/:id/revoke"' app/server.js
          grep -q '"/api/account/sessions/revoke-all"' app/server.js
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q '"/api/admin/billing/summary"' app/server.js
          grep -q 'RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/admin.html
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add security activity history and operations summary"
          git push
