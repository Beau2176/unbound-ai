name: Recovery Codes v0.17

on:
  push:
    branches:
      - recovery-codes-v0.17

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply recovery migrations
        run: |
          python scripts/fix-recovery-event-matcher-v017.py
          python scripts/migrate-recovery-server-v017.py
          python scripts/migrate-recovery-index-v017.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/recovery.js
          node --check app/security/rate-limit.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify recovery primitive contract
        working-directory: app
        run: |
          node - <<'NODE'
          const recovery = require('./security/recovery');
          const codes = recovery.generateRecoveryCodes();
          if (codes.length !== recovery.RECOVERY_CODE_COUNT) process.exit(1);
          if (new Set(codes).size !== codes.length) process.exit(1);
          for (const code of codes) {
            if (!recovery.isRecoveryCodeShape(code)) process.exit(1);
            if (!recovery.hashRecoveryCode(code)) process.exit(1);
            const compact = code.replaceAll('-', '').toLowerCase();
            if (recovery.hashRecoveryCode(compact) !== recovery.hashRecoveryCode(code)) process.exit(1);
          }
          const status = recovery.getRecoveryStatus();
          if (status.plaintextStored !== false || status.oneTimeUse !== true || status.codeEntropyBits < 90) process.exit(1);
          console.log('Recovery primitive contract OK');
          NODE
      - name: Verify recovery database and reset security
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_recovery_codes' app/server.js
          grep -q 'code_hash TEXT NOT NULL UNIQUE' app/server.js
          grep -q '"/api/auth/recovery-code/reset"' app/server.js
          grep -q '"/api/account/recovery-codes/regenerate"' app/server.js
          grep -q '"/api/account/recovery-codes/status"' app/server.js
          grep -q 'DELETE FROM user_sessions' app/server.js
          grep -q 'DELETE FROM account_passkeys' app/server.js
          grep -q 'UPDATE account_devices' app/server.js
          grep -q 'DELETE FROM account_recovery_codes WHERE user_id' app/server.js
          grep -q 'recovery.code_used' app/server.js
          grep -q 'recovery.codes_generated' app/server.js
          if grep -Eq 'account_recovery_codes[^;]*(code|recovery_code)[[:space:]]+TEXT' app/server.js; then
            echo 'Plaintext recovery-code column detected.'
            exit 1
          fi
      - name: Verify recovery UI
        run: |
          grep -q 'id="recoveryTab"' app/index.html
          grep -q 'id="recoveryForm"' app/index.html
          grep -q 'RESET WITH RECOVERY CODE' app/index.html
          grep -q 'id="recoveryCodesGenerateButton"' app/index.html
          grep -q 'id="recoveryCodeGrid"' app/index.html
          grep -q 'handleGenerateRecoveryCodes' app/index.html
          grep -q 'handleRecovery' app/index.html
      - name: Verify earlier security layers survived
        run: |
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'passkey_challenges' app/server.js
          grep -q 'account_devices' app/server.js
          grep -q 'account_security_events' app/server.js
          grep -q 'getAgeVerificationGatewayStatus' app/server.js
          grep -q 'getBillingGatewayStatus' app/server.js
          grep -q 'rate_limit_buckets' app/server.js
          grep -q 'passkeyAuth' app/security/rate-limit.js
          grep -q 'recovery' app/security/rate-limit.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add secure one-time account recovery codes"
            git push origin HEAD:recovery-codes-v0.17
          fi
