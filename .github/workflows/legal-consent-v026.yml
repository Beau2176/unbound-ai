name: Legal Consent v0.26

on:
  push:
    branches:
      - legal-consent-v0.26

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply legal consent migration
        run: python scripts/migrate-legal-consent-v026.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify v0.26 contract
        run: |
          grep -q 'account_legal_acceptances' app/server.js
          grep -q '/api/account/legal' app/server.js
          grep -q '/api/account/legal/accept' app/server.js
          grep -q 'legal_consent' app/access/entitlements.js
          grep -q 'buildLegalConsentStatus' app/privacy/legal-consent.js
          grep -q 'enforcementEnabled: false' app/privacy/legal-consent.js

      - name: Commit completed v0.26 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/access/entitlements.js app/privacy/legal-consent.js
          git rm scripts/migrate-legal-consent-v026.py .github/workflows/legal-consent-v026.yml
          git commit -m "Add versioned legal consent backend v0.26"
          git push origin HEAD:legal-consent-v0.26
