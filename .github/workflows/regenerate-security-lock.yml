name: Regenerate security lockfile

on:
  push:
    branches:
      - security-qs-6.16.0

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Regenerate lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- app/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "UNBOUND Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "Regenerate lockfile with patched dependencies [lockfile]"
          git push
