name: Legal Draft Pages v0.47

on:
  push:
    branches:
      - legal-draft-pages-v0.47

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply draft legal page integration
        run: node app/scripts/migrate-v047.js

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run full permanent CI
        working-directory: app
        run: npm run ci

      - name: Verify legal drafts remain non-binding
        working-directory: app
        run: |
          grep -q 'DRAFT — NOT YET IN FORCE' terms.html
          grep -q 'DRAFT — NOT YET IN FORCE' privacy.html
          grep -q 'noindex, nofollow' terms.html
          grep -q 'noindex, nofollow' privacy.html
          grep -q 'terms: "2026-09-draft"' privacy/legal-consent.js
          grep -q 'privacy: "2026-09-draft"' privacy/legal-consent.js
          grep -q 'terms: "/terms.html"' privacy/legal-consent.js
          grep -q 'privacy: "/privacy.html"' privacy/legal-consent.js
          node - <<'NODE'
          const { legalPublishingState } = require('./privacy/legal-consent');
          const state = legalPublishingState({
            UNBOUND_LEGAL_ACCEPTANCE_ENABLED: 'true',
            UNBOUND_LEGAL_ENFORCEMENT_ENABLED: 'true'
          });
          if (state.documentsPublished || state.acceptanceEnabled || state.enforcementEnabled) {
            throw new Error('Draft legal documents must not satisfy publication or consent enforcement.');
          }
          if (!state.documents.every((document) => document.url && document.version.includes('draft'))) {
            throw new Error('Draft legal catalog must expose reviewable URLs while retaining draft versions.');
          }
          console.log('Draft legal publication guard passed.');
          NODE

      - name: Verify explicit legal routes
        run: |
          grep -q 'app.get("/terms.html"' app/server.js
          grep -q 'app.get("/privacy.html"' app/server.js
          ! grep -q 'express.static(__dirname)' app/server.js

      - name: Commit completed v0.47 and remove one-time migration
        run: |
          rm app/scripts/migrate-v047.js
          rm .github/workflows/legal-draft-pages-v047.yml
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/terms.html app/privacy.html app/privacy/legal-consent.js app/scripts/regression-contract.js app/scripts/security-contract.js app/scripts/migrate-v047.js .github/workflows/legal-draft-pages-v047.yml
          git commit -m "Add guarded draft legal pages v0.47"
          git push origin HEAD:legal-draft-pages-v0.47
