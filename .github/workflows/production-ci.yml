name: Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked production dependencies
        run: npm ci
      - name: Run full permanent production CI
        run: npm run ci

  verify-database-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: unbound-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies and PostgreSQL client
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Verify integrated startup and real backup recovery
        env:
          TEST_POSTGRES_URL: postgresql://postgres:unbound-ci-only@127.0.0.1:5432/postgres
        run: npm run recovery-integration-check
