name: Billing Foundation v0.44

on:
  push:
    branches:
      - billing-adapter-foundation-v0.44

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply v0.44 billing integration
        run: node app/scripts/migrate-v044.js
      - name: Install locked dependencies
        working-directory: app
        run: npm ci
      - name: Run full permanent CI
        working-directory: app
        run: npm run ci
      - name: Verify billing integration contract
        run: |
          grep -q 'BILLING_WEBHOOK_PATH = "/api/webhooks/billing"' app/server.js
          grep -q '"/api/account/billing/checkout"' app/server.js
          grep -q '"/api/account/billing/portal"' app/server.js
          grep -q "VALUES (\$1, \$2, \$3, 'incomplete', 'top'" app/server.js
          grep -q 'processBillingWebhook({' app/server.js
          grep -q 'ON CONFLICT (provider, provider_event_id) DO NOTHING' app/server.js
          grep -q 'subscription-reference-not-found' app/server.js
          grep -q 'ignored-stale-event' app/server.js
          grep -q 'provider_subject_hash' app/server.js
      - name: Commit completed v0.44 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/billing/gateway.js app/package.json app/scripts/billing-contract.js app/scripts/security-contract.js
          git rm app/scripts/migrate-v044.js .github/workflows/billing-foundation-v044.yml
          git commit -m "Add provider-neutral billing foundation v0.44"
          git push
