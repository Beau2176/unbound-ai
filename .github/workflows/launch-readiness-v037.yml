name: Launch Readiness v0.37

on:
  push:
    branches:
      - launch-readiness-v0.37

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-readiness-v0.37
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply launch readiness integration
        run: python tools/apply_launch_readiness_v037.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify launch readiness policy
        working-directory: app
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { buildLaunchReadiness } = require('./ops/launch-readiness');

          const ready = buildLaunchReadiness({
            runtime: { ready: true, operational: true, status: 'ready' },
            maintenance: { active: false, mode: 'off' },
            recovery: { launchReady: true, blockers: [] },
            legal: {
              documentsPublished: true,
              acceptanceEnabled: true,
              enforcementEnabled: true
            },
            billing: {
              configured: true,
              provider: 'test-billing',
              checkout: true,
              customerPortal: true,
              webhooks: true,
              secretKey: 'MUST_NOT_LEAK'
            },
            ageVerification: {
              configured: true,
              provider: 'test-age',
              minimumAge: 18,
              startVerification: true,
              webhooks: true,
              webhookSecret: 'MUST_NOT_LEAK'
            },
            ai: {
              configured: true,
              provider: 'openai',
              streaming: true,
              research: true,
              apiKey: 'MUST_NOT_LEAK'
            },
            nowMs: Date.parse('2026-09-12T17:00:00Z')
          });
          assert.equal(ready.status, 'ready');
          assert.equal(ready.launchReady, true);
          assert.equal(ready.blockerCount, 0);
          const serializedReady = JSON.stringify(ready);
          assert.ok(!serializedReady.includes('MUST_NOT_LEAK'));

          const blocked = buildLaunchReadiness({
            runtime: { ready: true, operational: true, status: 'ready' },
            maintenance: { active: false, mode: 'off' },
            recovery: {
              launchReady: false,
              blockers: ['No managed recovery or external database backup is declared.']
            },
            legal: {
              documentsPublished: false,
              acceptanceEnabled: false,
              enforcementEnabled: false
            },
            billing: {
              configured: false,
              checkout: false,
              customerPortal: false,
              webhooks: false,
              state: 'provider-not-selected'
            },
            ageVerification: {
              configured: false,
              minimumAge: 18,
              startVerification: false,
              webhooks: false,
              state: 'adapter-not-installed'
            },
            ai: {
              configured: true,
              provider: 'openai',
              streaming: true,
              research: true
            },
            nowMs: Date.parse('2026-09-12T17:00:00Z')
          });
          assert.equal(blocked.status, 'blocked');
          assert.equal(blocked.launchReady, false);
          const keys = new Set(blocked.blockers.map((item) => item.key));
          assert.ok(keys.has('database_recovery'));
          assert.ok(keys.has('legal_published'));
          assert.ok(keys.has('legal_enforcement'));
          assert.ok(keys.has('billing_gateway'));
          assert.ok(keys.has('age_verification_gateway'));
          NODE

      - name: Verify launch gate source contract
        run: |
          grep -q 'legalPublishingState' app/server.js
          grep -q 'buildLaunchReadiness' app/server.js
          grep -q 'buildCurrentOperationalSnapshot' app/server.js
          grep -q '"/api/admin/ops/launch-readiness"' app/server.js
          grep -q 'launch,' app/server.js
          grep -q 'commercial_adult' app/ops/launch-readiness.js
          grep -q 'not legal advice' app/ops/launch-readiness.js
          grep -q 'does not mean' docs/LAUNCH_READINESS.md

      - name: Verify blocked current-style configuration
        working-directory: app
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { buildLaunchReadiness } = require('./ops/launch-readiness');
          const { legalPublishingState } = require('./privacy/legal-consent');
          const { getBillingGatewayStatus } = require('./billing/gateway');
          const { getAgeVerificationGatewayStatus } = require('./age/gateway');

          const result = buildLaunchReadiness({
            runtime: { ready: true, operational: true, status: 'ready' },
            maintenance: { active: false, mode: 'off' },
            recovery: { launchReady: false, blockers: ['Recovery not verified.'] },
            legal: legalPublishingState({}),
            billing: getBillingGatewayStatus({}),
            ageVerification: getAgeVerificationGatewayStatus({}),
            ai: { configured: true, provider: 'openai', streaming: true, research: true }
          });

          assert.equal(result.launchReady, false);
          assert.ok(result.blockerCount >= 4);
          NODE

      - name: Commit completed v0.37 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/ops/launch-readiness.js docs/LAUNCH_READINESS.md
          git rm tools/apply_launch_readiness_v037.py .github/workflows/launch-readiness-v037.yml
          if git diff --cached --quiet; then
            echo "No final changes to commit."
          else
            git commit -m "Add commercial launch readiness gate v0.37"
            git push origin HEAD:launch-readiness-v0.37
          fi
