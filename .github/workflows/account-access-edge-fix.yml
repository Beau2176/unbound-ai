name: Account Access edge fix

on:
  push:
    branches:
      - account-access-ui-v0.8.1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply edge-case fix
        run: python scripts/fix-account-access-mode.py
      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Validate access consistency
        run: |
          grep -q 'productMode === "research" && !canUseCapability("web_research")' app/index.html
          grep -q 'productMode: canUseCapability("web_research")' app/index.html
          grep -q 'aria-disabled' app/index.html
          grep -q 'authModal.hidden && accessModal.hidden' app/index.html
          grep -q 'historyModal.hidden && accessModal.hidden' app/index.html
      - name: Commit fix
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then
            echo "No edge-case changes to commit."
            exit 0
          fi
          git commit -m "Fix saved Research mode entitlement edge cases"
          git push
