name: Permanent Regression v0.39

on:
  push:
    branches:
      - permanent-regression-v0.39

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: permanent-regression-v0.39
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run full permanent CI including regression contracts
        working-directory: app
        run: npm run ci

      - name: Verify permanent CI wiring
        run: |
          grep -q '"regression-check": "node scripts/regression-contract.js"' app/package.json
          grep -q 'npm run regression-check' app/package.json
          grep -q 'UNBOUND AI regression contracts passed' app/scripts/regression-contract.js
          grep -q 'database_recovery' app/scripts/regression-contract.js
          grep -q 'serviceWriteBlocked' app/scripts/regression-contract.js
          grep -q 'Commercial Launch Readiness' app/scripts/regression-contract.js

      - name: Remove one-time validator and commit final v0.39
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/permanent-regression-v039.yml
          git add app/package.json app/scripts/regression-contract.js
          if git diff --cached --quiet; then
            echo "No final changes to commit."
          else
            git commit -m "Make launch hardening regression tests permanent v0.39"
            git push origin HEAD:permanent-regression-v0.39
          fi
