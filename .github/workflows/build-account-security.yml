name: Build and validate account security controls

on:
  push:
    branches:
      - account-security-v1.0
    paths:
      - .account-security-build/trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply account security controls
        run: python3 .account-security-build/apply.py

      - name: Install exact dependencies
        working-directory: app
        run: npm ci

      - name: Check Node and browser syntax
        run: |
          node --check app/server.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('app/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1]).filter(Boolean);
          for (const [index, code] of blocks.entries()) {
            try { new Function(code); }
            catch (error) {
              console.error(`index.html script ${index + 1}:`, error);
              process.exit(1);
            }
          }
          console.log('Browser JavaScript syntax OK.');
          NODE

      - name: Verify security endpoints and session behavior
        run: |
          grep -q '"/api/account/security"' app/server.js
          grep -q '"/api/account/password"' app/server.js
          grep -q '"/api/account/sessions/revoke-others"' app/server.js
          grep -q 'verifyPassword(currentPassword' app/server.js
          grep -q 'newPassword !== newPasswordConfirm' app/server.js
          grep -q 'DELETE FROM user_sessions' app/server.js
          grep -q 'token_hash <>' app/server.js
          grep -q 'setSessionCookie(res, token)' app/server.js
          grep -q 'id="securityModal"' app/index.html
          grep -q 'id="passwordChangeForm"' app/index.html
          grep -q 'id="revokeSessionsForm"' app/index.html
          grep -q 'fetch("/api/account/password"' app/index.html
          grep -q 'fetch("/api/account/sessions/revoke-others"' app/index.html
          ! grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' app
          git diff --check

      - name: Verify existing launch features remain
        run: |
          grep -q '"/api/account"' app/server.js
          grep -q 'type: "web_search"' app/ai/providers/openai.js
          grep -q 'app.post("/api/chat/stream"' app/server.js
          grep -q 'research_sources JSONB' app/server.js
          grep -q 'account_subscriptions' app/server.js
          grep -q 'data-product-mode="research"' app/index.html
          ! grep -q 'express.static(__dirname)' app/server.js

      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit validated source
        run: |
          git config user.name "UNBOUND Account Security Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          git commit -m "Add password and session security controls"
          git push
