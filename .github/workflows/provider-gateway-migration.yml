name: Provider gateway migration

on:
  push:
    branches:
      - provider-gateway-v0.5

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply provider gateway migration
        run: node scripts/migrate-provider-gateway.js
      - name: Validate JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Validate gateway status behavior
        run: |
          AI_PROVIDER=openai node -e 'const g=require("./app/ai/gateway"); const s=g.getGatewayStatus(); if(s.provider!=="openai" || s.configured!==false) process.exit(1); console.log(JSON.stringify(s))'
          AI_PROVIDER=not-a-provider node -e 'const g=require("./app/ai/gateway"); const s=g.getGatewayStatus(); if(s.error!=="unsupported-provider") process.exit(1); console.log(JSON.stringify(s))'
      - name: Commit migrated source
        run: |
          if git diff --quiet -- app/server.js; then
            echo "No server migration changes to commit."
            exit 0
          fi
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js
          git commit -m "Route chat through provider-neutral AI gateway"
          git push
