name: Server history migration

on:
  push:
    branches:
      - server-history-v0.7

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply server history migration
        run: python scripts/migrate-server-history.py
      - name: Validate server JavaScript
        run: |
          node --check app/server.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('script block not found')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Validate server history wiring
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS conversations' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS conversation_messages' app/server.js
          grep -q 'app.get(' app/server.js
          grep -q '"/api/conversations"' app/server.js
          grep -q '"/api/conversations/import"' app/server.js
          grep -q 'preparePersistentChat' app/server.js
          grep -q 'persistAssistantMessage' app/server.js
          grep -q 'conversationId: persistentChat' app/server.js
          grep -q 'id="historyButton"' app/index.html
          grep -q 'fetchServerConversationList' app/index.html
          grep -q 'activeConversationId' app/index.html
          grep -q 'conversationId: currentUser ? activeConversationId : null' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit migrated source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No source migration changes to commit."
            exit 0
          fi
          git commit -m "Add persistent server-side conversation history"
          git push
