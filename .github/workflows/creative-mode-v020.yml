name: Creative Mode v0.20

on:
  push:
    branches:
      - creative-mode-v0.20

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply Creative Mode migration
        run: python scripts/migrate-creative-mode-v020.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify Creative Mode entitlement
        working-directory: app
        run: |
          node - <<'NODE'
          const e = require('./access/entitlements');
          const creative = e.CAPABILITY_CATALOG.creative_mode;
          if (!creative || creative.implemented !== true || creative.minimumPlan !== 'free') process.exit(1);
          const access = e.buildCapabilityAccess({ planTier: 'free' });
          const item = access.find((x) => x.key === 'creative_mode');
          if (!item || !item.usable) process.exit(1);
          const disabled = e.buildCapabilityAccess({
            planTier: 'free',
            overrides: [{ key: 'creative_mode', enabled: false }]
          }).find((x) => x.key === 'creative_mode');
          if (!disabled || disabled.usable) process.exit(1);
          console.log('Creative entitlement contract OK');
          NODE
      - name: Verify Creative Mode server wiring
        run: |
          grep -q 'const CREATIVE_MODE_PROMPT' app/server.js
          grep -q 'normalized === "creative"' app/server.js
          grep -q 'productMode === "creative"' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "creative_mode")' app/server.js
          grep -q 'CREATIVE_MODE_PROMPT' app/server.js
          grep -q 'productMode === "research"' app/server.js
          grep -q 'Research Mode uses the sourced response endpoint instead of streaming' app/server.js
      - name: Verify Creative Mode UI
        run: |
          grep -q 'id="creativeModeButton"' app/index.html
          grep -q 'data-product-mode="creative"' app/index.html
          grep -q 'Creative Mode — Ideas, writing + worldbuilding' app/index.html
          grep -q 'creative_mode' app/index.html
          grep -q 'safeProductMode' app/index.html
          grep -q 'productMode,' app/index.html
      - name: Verify prior product/security layers survived
        run: |
          grep -q 'account_security_alerts' app/server.js
          grep -q 'auth.repeated_failed_sign_in' app/server.js
          grep -q 'account_recovery_codes' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'getAgeVerificationGatewayStatus' app/server.js
          grep -q 'getBillingGatewayStatus' app/server.js
          grep -q 'web_research' app/access/entitlements.js
          grep -q 'citations' app/access/entitlements.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/access/entitlements.js
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add Creative Mode"
            git push origin HEAD:creative-mode-v0.20
          fi
