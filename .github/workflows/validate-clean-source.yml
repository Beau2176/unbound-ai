name: Validate clean direct source

on:
  push:
    branches:
      - cleanup-direct-source

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install exact dependencies
        working-directory: app
        run: npm ci
      - name: Check server syntax
        working-directory: app
        run: node --check server.js
      - name: Check inline browser JavaScript
        working-directory: app
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
            for (const [i, code] of blocks.entries()) {
              try { new Function(code); }
              catch (error) { console.error(`${file} script ${i + 1}:`, error); process.exit(1); }
            }
          }
          console.log('Inline browser JavaScript syntax OK.');
          NODE
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate
