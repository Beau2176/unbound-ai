name: Recovery Readiness v0.33

on:
  push:
    branches:
      - recovery-readiness-v0.33

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-readiness-v0.33
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply recovery readiness migration
        run: python tools/apply_recovery_readiness_v033.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify recovery readiness policy
        working-directory: app
        run: |
          node <<'NODE'
          const assert = require('assert');
          const { buildRecoveryReadiness } = require('./ops/recovery-readiness');
          const now = Date.parse('2026-09-12T17:00:00Z');

          const none = buildRecoveryReadiness({ env: {}, nowMs: now });
          assert.equal(none.status, 'unprotected');
          assert.equal(none.launchReady, false);
          assert.ok(none.blockers.some((item) => item.includes('No managed recovery')));

          const managed = buildRecoveryReadiness({
            env: {
              DATABASE_BACKUP_MODE: 'managed',
              DATABASE_RESTORE_LAST_TESTED_AT: '2026-09-01T12:00:00Z'
            },
            nowMs: now
          });
          assert.equal(managed.launchReady, true);
          assert.equal(managed.backup.managedRecovery, true);

          const staleExternal = buildRecoveryReadiness({
            env: {
              DATABASE_BACKUP_MODE: 'external',
              DATABASE_BACKUP_LAST_VERIFIED_AT: '2026-09-10T00:00:00Z',
              DATABASE_BACKUP_MAX_AGE_HOURS: '26',
              DATABASE_RESTORE_LAST_TESTED_AT: '2026-09-01T12:00:00Z'
            },
            nowMs: now
          });
          assert.equal(staleExternal.launchReady, false);
          assert.equal(staleExternal.backup.fresh, false);

          const hybrid = buildRecoveryReadiness({
            env: {
              DATABASE_BACKUP_MODE: 'hybrid',
              DATABASE_BACKUP_LAST_VERIFIED_AT: '2026-09-12T12:00:00Z',
              DATABASE_RESTORE_LAST_TESTED_AT: '2026-09-01T12:00:00Z'
            },
            nowMs: now
          });
          assert.equal(hybrid.launchReady, true);
          assert.equal(hybrid.backup.externalBackup, true);
          assert.equal(hybrid.backup.managedRecovery, true);
          NODE

      - name: Verify backup script safely
        run: |
          bash -n app/scripts/backup-postgres.sh
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/out"
          cat > "$tmp/bin/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          outfile=''
          for arg in "$@"; do
            case "$arg" in
              --file=*) outfile="${arg#--file=}" ;;
            esac
          done
          test -n "$outfile"
          printf 'mock-postgres-custom-dump\n' > "$outfile"
          SH
          cat > "$tmp/bin/pg_restore" <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x "$tmp/bin/pg_dump" "$tmp/bin/pg_restore"
          PATH="$tmp/bin:$PATH" \
            BACKUP_DATABASE_URL='postgresql://redacted.invalid/unbound' \
            BACKUP_DIR="$tmp/out" \
            BACKUP_RETENTION_DAYS=14 \
            bash app/scripts/backup-postgres.sh
          test "$(find "$tmp/out" -name '*.dump' | wc -l)" -eq 1
          test "$(find "$tmp/out" -name '*.sha256' | wc -l)" -eq 1

      - name: Verify server recovery contract and shutdown
        run: |
          grep -q '"/api/admin/ops/recovery"' app/server.js
          grep -q 'buildRecoveryReadiness' app/server.js
          grep -q 'shutdownGracefully' app/server.js
          grep -q 'state: shuttingDown' app/ops/runtime-status.js
          PORT=32189 NODE_ENV=test node app/server.js > /tmp/unbound-v033.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:32189/healthz >/tmp/health.json; then break; fi
            sleep 0.25
          done
          grep -q '"live":true' /tmp/health.json
          kill -TERM "$pid"
          set +e
          wait "$pid"
          code=$?
          set -e
          trap - EXIT
          test "$code" -eq 0
          grep -q 'beginning graceful shutdown' /tmp/unbound-v033.log

      - name: Commit completed v0.33 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/ops/runtime-status.js app/ops/recovery-readiness.js app/scripts/backup-postgres.sh docs/INCIDENT_RECOVERY.md
          git rm tools/apply_recovery_readiness_v033.py .github/workflows/recovery-readiness-v033.yml
          if git diff --cached --quiet; then
            echo "No final changes to commit."
          else
            git commit -m "Add database recovery and incident readiness v0.33"
            git push origin HEAD:recovery-readiness-v0.33
          fi
