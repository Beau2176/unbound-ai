name: Device security v0.12

on:
  push:
    branches:
      - device-security-v0.12

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply device security migration
        run: |
          python scripts/migrate-device-security-v012.py
          python scripts/patch-device-cookie-v012.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify device persistence and privacy
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_devices' app/server.js
          grep -q 'device_token_hash TEXT NOT NULL' app/server.js
          grep -q 'ADD COLUMN IF NOT EXISTS device_id BIGINT' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS account_security_events' app/server.js
          grep -q 'function hashDeviceToken' app/server.js
          grep -q 'DEVICE_COOKIE = "unbound_device"' app/server.js
          grep -q 'HttpOnly; Path=/; SameSite=Lax' app/server.js
          test "$(grep -c 'res.append(' app/server.js)" -ge 3
          if grep -Eiq 'ip_address|remote_addr|client_ip|last_ip' app/server.js; then
            echo 'IP persistence field detected.'
            exit 1
          fi
      - name: Verify account device controls
        run: |
          grep -q '"/api/account/devices"' app/server.js
          grep -q '"/api/account/devices/:id/revoke"' app/server.js
          grep -q '"/api/account/sessions/revoke-all"' app/server.js
          grep -q 'device.registered' app/server.js
          grep -q 'device.revoked' app/server.js
          grep -q 'sessions.all_revoked' app/server.js
          grep -q 'id="deviceList"' app/index.html
          grep -q 'id="logoutAllForm"' app/index.html
          grep -q 'handleLogoutAllDevices' app/index.html
          grep -q 'deviceRevokePassword' app/index.html
      - name: Verify current-device protection and password checks
        run: |
          grep -q 'You cannot revoke the device you are currently using' app/server.js
          grep -q 'Current password is incorrect' app/server.js
          grep -q 'verifyPassword(password, user.password_hash)' app/server.js
      - name: Verify existing age, billing, research and deletion features survived
        run: |
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q '"/api/admin/age-verification/summary"' app/server.js
          grep -q '"/api/admin/billing/summary"' app/server.js
          grep -q '"/api/admin/users/:id/entitlements/:key"' app/server.js
          grep -q 'RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add device and session security controls"
          git push
