name: Admin entitlements latest-main sync

on:
  push:
    branches:
      - admin-entitlements-v0.9-sync

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Merge validated v0.9 branch
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin admin-entitlements-v0.9
          git merge --no-ff origin/admin-entitlements-v0.9 -m "Merge admin entitlement controls with latest account security"
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html', 'admin.html']:
              html = Path('app', name).read_text()
              start = html.rfind('<script>')
              end = html.rfind('</script>')
              if start < 0 or end <= start:
                  raise SystemExit(f'{name}: script block missing')
              Path(f'/tmp/{name}.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/index.html.js
          node --check /tmp/admin.html.js
      - name: Verify Account Security survived
        run: |
          grep -q '"/api/account/security"' app/server.js
          grep -q '"/api/account/password"' app/server.js
          grep -q '"/api/account/sessions/revoke-others"' app/server.js
          grep -q '"/api/account"' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Verify admin entitlement controls
        run: |
          grep -q '"/api/admin/entitlements/catalog"' app/server.js
          grep -q '"/api/admin/users/:id/access"' app/server.js
          grep -q '"/api/admin/users/:id/entitlements/:key"' app/server.js
          grep -q 'user.entitlement_override.set' app/server.js
          grep -q 'user.entitlement_override.cleared' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "chat")' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "streaming")' app/server.js
          grep -q 'assertRequestCapability(req, "web_research")' app/server.js
          grep -q 'assertRequestCapability(req, "citations")' app/server.js
          grep -q 'EXPIRED OVERRIDE' app/admin.html
          grep -q 'id="entitlementUser"' app/admin.html
          grep -q 'applyEntitlementOverride' app/admin.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Push merged validated source
        run: git push origin HEAD:admin-entitlements-v0.9-sync
