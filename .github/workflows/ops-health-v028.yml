name: Ops Health v0.28

on:
  push:
    branches:
      - ops-health-v0.28

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply operational health migration
        run: python scripts/migrate-ops-health-v028.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify runtime status helpers
        working-directory: app
        run: |
          node - <<'NODE'
          const {
            getRuntimeIdentity,
            buildLivenessStatus,
            buildReadinessStatus
          } = require('./ops/runtime-status');

          const env = {
            NODE_ENV: 'production',
            RENDER_SERVICE_NAME: 'unbound-ai-app',
            RENDER_GIT_COMMIT: '1234567890abcdef'
          };
          const identity = getRuntimeIdentity(env);
          if (identity.commitShort !== '1234567890ab') throw new Error('Commit identity failed');

          const live = buildLivenessStatus({ env, uptimeSeconds: 12.8 });
          if (!live.live || live.status !== 'ok' || live.uptimeSeconds !== 12) {
            throw new Error('Liveness contract failed');
          }

          const ready = buildReadinessStatus({
            env,
            uptimeSeconds: 9,
            databaseConfigured: true,
            databaseReady: true,
            aiStatus: { configured: true, provider: 'openai', model: 'test-model' }
          });
          if (!ready.ready || ready.status !== 'ready') throw new Error('Readiness success failed');

          const notReady = buildReadinessStatus({
            env,
            databaseConfigured: true,
            databaseReady: false,
            databaseError: new Error('do not expose me'),
            aiStatus: { configured: false }
          });
          if (notReady.ready || notReady.components.database.state !== 'error') {
            throw new Error('Readiness failure contract failed');
          }
          if (JSON.stringify(notReady).includes('do not expose me')) {
            throw new Error('Readiness status leaked an internal error');
          }
          console.log('Operational runtime status helpers OK');
          NODE

      - name: Verify v0.28 route contract
        run: |
          grep -q 'app.get("/healthz"' app/server.js
          grep -q 'app.get("/readyz"' app/server.js
          grep -q 'app.get("/api/system/status"' app/server.js
          grep -q 'Cache-Control", "no-store"' app/server.js
          grep -q 'RENDER_GIT_COMMIT' app/ops/runtime-status.js

      - name: Commit completed v0.28 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/ops/runtime-status.js
          git rm scripts/migrate-ops-health-v028.py .github/workflows/ops-health-v028.yml
          git commit -m "Add operational health endpoints v0.28"
          git push origin HEAD:ops-health-v0.28
