name: Production smoke test — Research Mode

on:
  push:
    branches:
      - production-smoke-research
    paths:
      - .smoke/trigger.txt

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SERVICE_URL: https://unbound-ai-app.onrender.com
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$SERVICE_URL/api/health" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "Health attempt $attempt returned HTTP $code"
            sleep 5
          done
          test "$(cat /tmp/health.json 2>/dev/null | wc -c)" -gt 0
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True, data
          assert data.get('database') == 'connected', data
          ai=data.get('ai') or {}
          assert ai.get('configured') is True, ai
          assert ai.get('streaming') is True, ai
          assert ai.get('research') is True, ai
          print('Health OK:', {k: ai.get(k) for k in ('provider','model','streaming','research')})
          PY

      - name: Verify live UI has both mode controls
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$SERVICE_URL/" -o /tmp/index.html
          grep -q 'data-product-mode="standard"' /tmp/index.html
          grep -q 'data-product-mode="research"' /tmp/index.html
          grep -q 'data-depth-style="casual"' /tmp/index.html
          grep -q 'data-depth-style="work"' /tmp/index.html
          grep -q 'class="inline-citation"' /tmp/index.html
          echo 'Live UI controls and citation renderer are present.'

      - name: Verify server source is not public
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/server-source-check -w '%{http_code}' --max-time 20 "$SERVICE_URL/server.js")"
          if [ "$code" = "200" ]; then
            echo 'SECURITY FAILURE: /server.js returned HTTP 200' >&2
            exit 1
          fi
          echo "/server.js correctly blocked with HTTP $code"

      - name: Verify Standard streaming path
        run: |
          set -euo pipefail
          curl -fsS --max-time 90 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/x-ndjson' \
            -d '{"message":"Reply with exactly STANDARD_SMOKE_OK and nothing else.","history":[],"depthStyle":"casual","productMode":"standard"}' \
            "$SERVICE_URL/api/chat/stream" > /tmp/stream.ndjson
          python3 - <<'PY'
          import json
          events=[]
          with open('/tmp/stream.ndjson') as f:
              for line in f:
                  line=line.strip()
                  if line:
                      events.append(json.loads(line))
          assert any(e.get('type')=='meta' for e in events), events
          assert any(e.get('type')=='delta' and e.get('delta') for e in events), events
          assert any(e.get('type')=='done' for e in events), events
          text=''.join(e.get('delta','') for e in events if e.get('type')=='delta')
          assert 'STANDARD_SMOKE_OK' in text, text
          print('Standard streaming OK; reply:', text[:120])
          PY

      - name: Verify Research web search and citations
        run: |
          set -euo pipefail
          curl -fsS --max-time 150 \
            -H 'Content-Type: application/json' \
            -d '{"message":"Use web research to identify the current title shown on OpenAI’s official homepage. Answer in one short sentence and cite the source.","history":[],"depthStyle":"casual","productMode":"research"}' \
            "$SERVICE_URL/api/chat" > /tmp/research.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/research.json'))
          assert data.get('productMode') == 'research', data
          assert isinstance(data.get('reply'), str) and data['reply'].strip(), data
          assert int(data.get('webSearchCalls') or 0) >= 1, data
          sources=data.get('sources') or []
          citations=data.get('citations') or []
          assert len(sources) >= 1, data
          assert len(citations) >= 1, data
          for source in sources:
              assert str(source.get('url','')).startswith(('http://','https://')), source
          print('Research OK:', {
              'webSearchCalls': data.get('webSearchCalls'),
              'sources': len(sources),
              'citations': len(citations),
              'replyPreview': data['reply'][:160]
          })
          PY
