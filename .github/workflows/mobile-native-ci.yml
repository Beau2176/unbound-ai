name: Mobile Native CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-ci.yml'
  workflow_dispatch:

jobs:
  android-scaffold:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify official native brand source
        run: npm run verify:assets
      - name: Verify store config is safe and release remains blocked
        run: npm run verify:store-config
      - name: Generate Android project with store-safe config
        run: npm run add:android:store
      - name: Sync Android store-safe config
        run: node scripts/run-capacitor.mjs store sync android
      - name: Verify Android store config has no remote server
        run: |
          test -f android/app/src/main/assets/capacitor.config.json
          if grep -q 'unbound-ai-app.onrender.com' android/app/src/main/assets/capacitor.config.json; then
            echo 'Store-safe Android config unexpectedly contains the Render development server.'
            exit 1
          fi
      - name: Verify explicit Android remote-development mode
        run: |
          node scripts/run-capacitor.mjs remote-dev sync android
          grep -q 'unbound-ai-app.onrender.com' android/app/src/main/assets/capacitor.config.json
      - name: Generate official Android icons and splash resources
        run: npm run assets:android
      - name: Register UNBOUND Android URL scheme
        run: npm run configure:links:android
      - name: Configure Android camera and microphone permissions
        run: npm run configure:permissions:android
      - name: Verify Android package
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -d android/app/src/main/res
          grep -q 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml
          grep -q '@string/custom_url_scheme' android/app/src/main/AndroidManifest.xml
          grep -q '<string name="custom_url_scheme">unbound</string>' android/app/src/main/res/values/strings.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera.any" android:required="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera" android:required="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera.autofocus" android:required="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.microphone" android:required="false"' android/app/src/main/AndroidManifest.xml
          if grep -Eq 'CAPTURE_AUDIO_OUTPUT|CAPTURE_VIDEO_OUTPUT|FOREGROUND_SERVICE_CAMERA|FOREGROUND_SERVICE_MICROPHONE' android/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected broad/background media permission found.'
            exit 1
          fi

  ios-scaffold:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify official native brand source
        run: npm run verify:assets
      - name: Verify store config is safe and release remains blocked
        run: npm run verify:store-config
      - name: Generate iOS project with store-safe config
        run: npm run add:ios:store
      - name: Sync iOS store-safe config
        run: node scripts/run-capacitor.mjs store sync ios
      - name: Verify iOS store config has no remote server
        run: |
          test -f ios/App/App/capacitor.config.json
          if grep -q 'unbound-ai-app.onrender.com' ios/App/App/capacitor.config.json; then
            echo 'Store-safe iOS config unexpectedly contains the Render development server.'
            exit 1
          fi
      - name: Verify explicit iOS remote-development mode
        run: |
          node scripts/run-capacitor.mjs remote-dev sync ios
          grep -q 'unbound-ai-app.onrender.com' ios/App/App/capacitor.config.json
      - name: Generate official iOS icons and splash resources
        run: npm run assets:ios
      - name: Register UNBOUND iOS URL scheme
        run: npm run configure:links:ios
      - name: Configure iOS camera and microphone usage descriptions
        run: npm run configure:permissions:ios
      - name: Verify iOS project
        run: |
          test -f ios/App/App/Info.plist
          test -d ios/App/App/Assets.xcassets
          grep -q '<key>CFBundleURLTypes</key>' ios/App/App/Info.plist
          grep -q '<string>ai.unbound.app</string>' ios/App/App/Info.plist
          grep -q '<string>unbound</string>' ios/App/App/Info.plist
          grep -q '<key>NSCameraUsageDescription</key>' ios/App/App/Info.plist
          grep -q 'UNBOUND AI uses the camera only when you choose Photo or Video to capture media for chat.' ios/App/App/Info.plist
          grep -q '<key>NSMicrophoneUsageDescription</key>' ios/App/App/Info.plist
          grep -q 'UNBOUND AI uses the microphone only when you choose a feature that records audio, such as video capture.' ios/App/App/Info.plist
