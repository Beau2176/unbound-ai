name: Billing Webhooks v0.45

on:
  push:
    branches:
      - billing-webhooks-v0.45

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply billing webhook integration
        run: node app/scripts/migrate-v045.js

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run full permanent CI
        working-directory: app
        run: npm run ci

      - name: Verify billing webhook source contract
        run: |
          grep -q 'BILLING_WEBHOOK_PATH = "/api/webhooks/billing"' app/server.js
          grep -q 'processBillingWebhook' app/server.js
          grep -q 'billing_subject_hash' app/server.js
          grep -q 'last_event_at TIMESTAMPTZ' app/server.js
          grep -q 'billing-subject-not-found' app/server.js
          grep -q 'ignored-stale-event' app/server.js
          grep -q 'provider-subscription-conflict' app/server.js
          grep -q 'verifyWebhook' app/billing/gateway.js
          grep -q 'parseWebhook' app/billing/gateway.js

      - name: Commit completed v0.45 and remove one-time migration
        run: |
          rm app/scripts/migrate-v045.js
          rm .github/workflows/billing-webhooks-v045.yml
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/billing/gateway.js app/scripts/billing-session-contract.js app/scripts/migrate-v045.js .github/workflows/billing-webhooks-v045.yml
          git commit -m "Add authenticated billing webhooks v0.45"
          git push origin HEAD:billing-webhooks-v0.45
