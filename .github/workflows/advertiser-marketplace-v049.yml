name: Advertiser Marketplace v0.49

on:
  push:
    branches:
      - advertiser-marketplace-v0.49

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply advertiser marketplace integration
        run: node scripts/migrate-v049-advertising.js
      - name: Install locked dependencies
        run: npm ci
      - name: Run full permanent CI
        run: npm run ci
      - name: Verify advertiser source contract
        run: node scripts/advertising-contract.js
      - name: Commit completed v0.49 and remove one-time migration
        run: |
          rm scripts/migrate-v049-advertising.js
          rm ../.github/workflows/advertiser-marketplace-v049.yml
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js index.html admin.html package.json scripts/security-contract.js scripts/advertising-contract.js advertising/catalog.js advertising/gateway.js advertisers.html advertising-admin.html ../.github/workflows/advertiser-marketplace-v049.yml scripts/migrate-v049-advertising.js
          git commit -m "Add advertiser marketplace v0.49"
          git push
