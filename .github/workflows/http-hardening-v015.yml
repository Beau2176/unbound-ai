name: HTTP hardening v0.15

on:
  push:
    branches:
      - http-hardening-v0.15

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply HTTP hardening migration
        run: python scripts/migrate-http-hardening-v015.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/http-security.js
      - name: Verify HTTP security contract
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {
            buildContentSecurityPolicy,
            createHttpSecurityMiddleware,
            createSameOriginApiGuard,
            getHttpSecurityStatus,
            isOriginAllowed,
            isStateChangingApiRequest
          } = require('./app/security/http-security');

          const prodCsp = buildContentSecurityPolicy({ isProduction: true });
          assert.match(prodCsp, /frame-ancestors 'none'/);
          assert.match(prodCsp, /object-src 'none'/);
          assert.match(prodCsp, /upgrade-insecure-requests/);

          const same = {
            method: 'POST',
            path: '/api/chat',
            headers: {
              host: 'unbound.example',
              origin: 'https://unbound.example',
              'x-forwarded-proto': 'https',
              'sec-fetch-site': 'same-origin'
            }
          };
          assert.equal(isStateChangingApiRequest(same), true);
          assert.equal(isOriginAllowed(same, { isProduction: true }), true);

          const cross = {
            ...same,
            headers: {
              ...same.headers,
              origin: 'https://evil.example',
              'sec-fetch-site': 'cross-site'
            }
          };
          assert.equal(isOriginAllowed(cross, { isProduction: true }), false);

          const sameSiteDifferentHost = {
            ...same,
            headers: {
              ...same.headers,
              origin: 'https://other.example',
              'sec-fetch-site': 'same-site'
            }
          };
          assert.equal(isOriginAllowed(sameSiteDifferentHost, { isProduction: true }), false);

          const nonBrowserClient = {
            ...same,
            headers: { host: 'unbound.example', 'x-forwarded-proto': 'https' }
          };
          assert.equal(isOriginAllowed(nonBrowserClient, { isProduction: true }), true);

          const getRequest = { ...cross, method: 'GET' };
          assert.equal(isOriginAllowed(getRequest, { isProduction: true }), true);

          const headers = {};
          let nextCalled = false;
          createHttpSecurityMiddleware({ isProduction: true })(
            { path: '/api/account/security', headers: {} },
            { setHeader: (key, value) => { headers[key] = value; } },
            () => { nextCalled = true; }
          );
          assert.equal(nextCalled, true);
          assert.equal(headers['X-Frame-Options'], 'DENY');
          assert.equal(headers['X-Content-Type-Options'], 'nosniff');
          assert.equal(headers['Cache-Control'], 'no-store, max-age=0');
          assert.equal(headers['Strict-Transport-Security'], 'max-age=31536000');
          assert.match(headers['X-Request-ID'], /^[0-9a-f-]{36}$/i);

          let rejected = null;
          createSameOriginApiGuard({ isProduction: true })(
            cross,
            {
              status(code) { rejected = { code }; return this; },
              json(body) { rejected.body = body; return body; }
            },
            () => { throw new Error('cross-site request should not reach next'); }
          );
          assert.equal(rejected.code, 403);

          const status = getHttpSecurityStatus({ isProduction: true });
          assert.equal(status.sameOriginMutationGuard, true);
          assert.equal(status.clickjackingProtection, true);
          assert.equal(status.hsts, true);
          console.log('HTTP security contract OK');
          NODE
      - name: Verify server wiring
        run: |
          grep -q 'createHttpSecurityMiddleware' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'httpSecurity: getHttpSecurityStatus' app/server.js
          grep -q 'PUBLIC_APP_ORIGIN' app/server.js
          grep -q 'express.json({ limit: "100kb" })' app/server.js
      - name: Verify previous protection survived
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS rate_limit_buckets' app/server.js
          grep -q 'chatRateLimit' app/server.js
          grep -q 'securityActionRateLimit' app/server.js
          grep -q '"/api/account/security/events"' app/server.js
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q 'RESEARCH_MODE_PROMPT' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/security/http-security.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add HTTP security and same-origin protections"
          git push
