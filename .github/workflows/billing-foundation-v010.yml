name: Billing foundation v0.10

on:
  push:
    branches:
      - billing-foundation-v0.10

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply billing foundation migration
        run: python scripts/migrate-billing-foundation.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/billing/gateway.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/admin.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('admin script block missing')
          Path('/tmp/unbound-admin.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-admin.js
      - name: Verify billing gateway contract
        run: |
          node - <<'NODE'
          const billing = require('./app/billing/gateway');
          const blank = billing.getBillingGatewayStatus({});
          if (blank.configured || blank.state !== 'provider-not-selected') process.exit(1);
          const selected = billing.getBillingGatewayStatus({ BILLING_PROVIDER: 'future-provider' });
          if (selected.configured || selected.state !== 'adapter-not-installed') process.exit(1);
          if (!billing.subscriptionStatusAllowsAccess('active')) process.exit(1);
          if (!billing.subscriptionStatusAllowsAccess('trialing')) process.exit(1);
          if (billing.subscriptionStatusAllowsAccess('past_due')) process.exit(1);
          if (billing.normalizeSubscriptionStatus('nonsense') !== 'none') process.exit(1);
          console.log('Billing gateway contract OK');
          NODE
      - name: Verify billing persistence and admin visibility
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS billing_webhook_events' app/server.js
          grep -q 'UNIQUE(provider, provider_event_id)' app/server.js
          grep -q 'payload_sha256 TEXT NOT NULL' app/server.js
          grep -q '"/api/admin/billing/summary"' app/server.js
          grep -q 'billing: getBillingGatewayStatus()' app/server.js
          grep -q 'id="billingAdapter"' app/admin.html
          grep -q 'loadBilling' app/admin.html
          grep -q 'No payment processor is selected yet' app/admin.html
      - name: Verify existing v0.9 and Account Security survived
        run: |
          grep -q '"/api/admin/users/:id/entitlements/:key"' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "chat")' app/server.js
          grep -q '"/api/account/security"' app/server.js
          grep -q '"/api/account/password"' app/server.js
          grep -q '"/api/account/sessions/revoke-others"' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/admin.html app/billing/gateway.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add provider-neutral billing foundation"
          git push
