name: HTTP Performance v0.32

on:
  push:
    branches:
      - http-performance-v0.32

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply HTTP performance migration
        run: python scripts/migrate-http-performance-v032.py

      - name: Add compression dependency
        working-directory: app
        run: npm install compression --save

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify HTTP performance contract
        run: |
          grep -q 'const compression = require("compression")' app/server.js
          grep -q 'req.path === "/api/chat/stream"' app/server.js
          grep -q 'app.use("/api"' app/server.js
          grep -q 'Cache-Control", "no-store"' app/server.js
          grep -q 'Cache-Control", "no-cache"' app/server.js
          grep -q 'stale-while-revalidate=604800' app/server.js

      - name: Smoke test compression and cache headers
        working-directory: app
        run: |
          PORT=3100 NODE_ENV=test node server.js >/tmp/unbound-v032.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3100/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/unbound-v032.log
            exit 1
          fi

          curl -sS -H 'Accept-Encoding: gzip' -D /tmp/index-headers.txt -o /tmp/index-body.bin http://127.0.0.1:3100/index.html
          grep -qi '^Content-Encoding: gzip' /tmp/index-headers.txt
          grep -qi '^Cache-Control: no-cache' /tmp/index-headers.txt

          curl -sS -D /tmp/image-headers.txt -o /dev/null http://127.0.0.1:3100/unbound-cosmic.png
          grep -qi '^Cache-Control: public, max-age=86400, stale-while-revalidate=604800' /tmp/image-headers.txt

          curl -sS -D /tmp/api-headers.txt -o /dev/null http://127.0.0.1:3100/api/system/status || true
          grep -qi '^Cache-Control: no-store' /tmp/api-headers.txt

          curl -sS -X POST -H 'Content-Type: application/json' -H 'Accept-Encoding: gzip' -d '{"message":"test"}' -D /tmp/stream-headers.txt -o /dev/null http://127.0.0.1:3100/api/chat/stream || true
          if grep -qi '^Content-Encoding: gzip' /tmp/stream-headers.txt; then
            echo 'Streaming endpoint must not be gzip-compressed.'
            exit 1
          fi

      - name: Commit completed v0.32 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/package.json app/package-lock.json
          git rm scripts/migrate-http-performance-v032.py .github/workflows/http-performance-v032.yml
          git commit -m "Add HTTP compression and cache policy v0.32"
          git push origin HEAD:http-performance-v0.32
