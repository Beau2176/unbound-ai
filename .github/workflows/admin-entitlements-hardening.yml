name: Admin entitlement hardening

on:
  push:
    branches:
      - admin-entitlements-v0.9

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply hardening
        run: python scripts/harden-admin-entitlements.py
      - name: Validate server and admin JavaScript
        run: |
          node --check app/server.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/admin.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          Path('/tmp/unbound-admin.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-admin.js
      - name: Verify implemented capability enforcement
        run: |
          grep -q 'assertOptionalAccountCapability(req, "chat")' app/server.js
          grep -q '"work_mode" : "casual_mode"' app/server.js
          grep -q 'assertOptionalAccountCapability(req, "streaming")' app/server.js
          grep -q 'assertRequestCapability(req, "web_research")' app/server.js
          grep -q 'assertRequestCapability(req, "citations")' app/server.js
          grep -q 'requireCapability("server_history")' app/server.js
      - name: Verify override expiry handling
        run: |
          grep -q 'const active =' app/server.js
          grep -q 'EXPIRED OVERRIDE' app/admin.html
      - name: Preserve guest Standard access in helper design
        run: |
          grep -q 'if (!user) return null;' app/server.js
          grep -q 'hasSessionCookie' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit hardening
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/admin.html
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "Enforce administrator capability overrides"
          git push
