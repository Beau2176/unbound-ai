name: Integrate Research Mode with streaming

on:
  push:
    branches:
      - feature-research-stream-sync
    paths:
      - .research-stream-integration/trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Fetch validated Research source
        run: git fetch origin feature-research-mode
      - name: Three-way merge Research UI with streaming UI
        run: |
          git show a1759aff73bfd7f0765d7c786c2b5fe4e32ebaa6:app/index.html > /tmp/base-index.html
          git show origin/feature-research-mode:app/index.html > /tmp/research-index.html
          git merge-file app/index.html /tmp/base-index.html /tmp/research-index.html || true
          python3 .research-stream-integration/resolve_index.py
          git show a1759aff73bfd7f0765d7c786c2b5fe4e32ebaa6:app/admin.html > /tmp/base-admin.html
          git show origin/feature-research-mode:app/admin.html > /tmp/research-admin.html
          git merge-file app/admin.html /tmp/base-admin.html /tmp/research-admin.html || true
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' app/admin.html; then
            echo 'Unresolved admin merge conflict' >&2
            exit 1
          fi
      - name: Integrate Research capability with provider gateway
        run: |
          git show b2bd4f751ee10b53b48e8ac3179a8814c9f4bd7b:.research-integration/integrate.py > /tmp/integrate-research.py
          python3 /tmp/integrate-research.py
      - name: Install exact dependencies
        working-directory: app
        run: npm ci
      - name: Check server and provider syntax
        run: |
          node --check app/server.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Check browser JavaScript syntax
        working-directory: app
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
            for (const [i, code] of blocks.entries()) {
              try { new Function(code); }
              catch (error) { console.error(`${file} script ${i + 1}:`, error); process.exit(1); }
            }
          }
          console.log('Browser JavaScript syntax OK.');
          NODE
      - name: Verify combined streaming and Research wiring
        run: |
          grep -q 'app.post("/api/chat/stream"' app/server.js
          grep -q 'research: providerSupportsResearch(provider)' app/ai/gateway.js
          grep -q 'type: "web_search"' app/ai/providers/openai.js
          grep -q 'web_search_call.action.sources' app/ai/providers/openai.js
          grep -q 'web_search_calls' app/server.js
          grep -q 'data-product-mode="research"' app/index.html
          grep -q 'class="inline-citation"' app/index.html
          grep -q 'fetch("/api/chat/stream"' app/index.html
          grep -q 'fetch("/api/chat"' app/index.html
          grep -q 'productMode === "research"' app/index.html
          git diff --check
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit validated combined build
        run: |
          git config user.name "UNBOUND Research Stream Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/admin.html app/ai/gateway.js app/ai/providers/openai.js
          git commit -m "Combine streaming chat with provider-neutral Research Mode"
          git push
