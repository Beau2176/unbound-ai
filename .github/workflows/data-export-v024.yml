name: Download My Data v0.24

on:
  push:
    branches:
      - data-export-v0.24

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply data export migration
        run: python scripts/migrate-data-export-v024.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/privacy/data-export.js
          node --check app/access/entitlements.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify data export helper contract
        working-directory: app
        run: |
          node - <<'NODE'
          const e = require('./privacy/data-export');
          const filename = e.buildExportFilename(new Date('2026-09-12T00:00:00Z'));
          if (filename !== 'unbound-ai-data-2026-09-12.json') process.exit(1);
          const payload = e.buildDataExport({ account: { email: 'person@example.com' } });
          if (payload.exportVersion !== 1 || payload.product !== 'UNBOUND AI') process.exit(1);
          if (payload.account.email !== 'person@example.com') process.exit(1);
          if (payload.privacy.excludesAuthenticationSecrets !== true) process.exit(1);
          if (!Array.isArray(payload.conversations) || !Array.isArray(payload.security.devices)) process.exit(1);
          console.log('Data export helper contract OK');
          NODE
      - name: Verify data export entitlement and endpoint
        run: |
          grep -q 'data_export: Object.freeze' app/access/entitlements.js
          grep -q 'label: "Download My Data"' app/access/entitlements.js
          grep -q '"/api/account/export"' app/server.js
          grep -q 'requireCapability("data_export")' app/server.js
          grep -q 'buildDataExport' app/server.js
          grep -q 'Content-Disposition' app/server.js
          grep -q 'account.data_exported' app/server.js
      - name: Verify export does not select authentication secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/server.js').read_text()
          start = text.index('app.get(\n  "/api/account/export"')
          end = text.index('/* ------------------------- CONVERSATION HISTORY', start)
          route = text[start:end]
          forbidden = [
              'password_hash', 'token_hash', 'device_token_hash', 'code_hash',
              'credential_id', 'public_key', 'provider_reference_hash',
              'provider_response_id', 'user_handle'
          ]
          found = [item for item in forbidden if item in route]
          if found:
              raise SystemExit('Sensitive export columns detected: ' + ', '.join(found))
          required = [
              'conversation_messages', 'account_devices', 'account_security_events',
              'account_security_alerts', 'account_passkeys', 'account_recovery_codes',
              'usage_events', 'account_entitlement_overrides'
          ]
          missing = [item for item in required if item not in route]
          if missing:
              raise SystemExit('Expected export sections missing: ' + ', '.join(missing))
          print('Sensitive-column export guard OK')
          PY
      - name: Verify browser download workflow
        run: |
          grep -q 'id="dataExportButton"' app/index.html
          grep -q 'DOWNLOAD MY DATA' app/index.html
          grep -q 'handleDataExport' app/index.html
          grep -q 'URL.createObjectURL' app/index.html
          grep -q 'link.download = filename' app/index.html
          grep -q 'account.data_exported.*Account data exported' app/index.html
      - name: Verify prior product privacy and security layers survived
        run: |
          grep -q 'user_ai_preferences' app/server.js
          grep -q 'const ADULT_MODE_PROMPT' app/server.js
          grep -q 'assertAgeVerifiedAdult(req)' app/server.js
          grep -q 'const UNBOUND_MODE_PROMPT' app/server.js
          grep -q 'const CREATIVE_MODE_PROMPT' app/server.js
          grep -q 'const RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'chat_stream_" + productMode' app/server.js
          grep -q 'account_security_alerts' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'account_recovery_codes' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/access/entitlements.js
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add privacy-safe account data export"
            git push origin HEAD:data-export-v0.24
          fi
