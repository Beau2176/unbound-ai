name: Accessibility v0.31

on:
  push:
    branches:
      - accessibility-hardening-v0.31

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply accessibility migration
        run: python scripts/migrate-accessibility-v031.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify accessibility contract
        run: |
          grep -q 'class="skip-link" href="#main-content"' app/index.html
          grep -q 'id="main-content" class="page" tabindex="-1"' app/index.html
          grep -q ':focus-visible' app/index.html
          grep -q 'prefers-reduced-motion: reduce' app/index.html
          grep -q 'function modalFocusables' app/index.html
          grep -q 'function trapModalTabKey' app/index.html
          grep -q 'restoreModalReturnFocus' app/index.html
          grep -q 'if (trapModalTabKey(event)) return;' app/index.html

      - name: Validate browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/index.html').read_text()
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/unbound-index-script.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/unbound-index-script.js

      - name: Commit completed v0.31 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/index.html
          git rm scripts/migrate-accessibility-v031.py .github/workflows/accessibility-v031.yml
          git commit -m "Harden keyboard and reduced-motion accessibility v0.31"
          git push origin HEAD:accessibility-hardening-v0.31
