name: Commercial entitlement migration

on:
  push:
    branches:
      - commercial-entitlements-v0.8

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply commercial entitlement migration
        run: python scripts/migrate-commercial-entitlements.py
      - name: Validate JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Validate entitlement behavior
        run: |
          node <<'NODE'
          const e = require('./app/access/entitlements');
          const free = e.buildCapabilityAccess({ planTier: 'free' });
          const top = e.buildCapabilityAccess({ planTier: 'top' });
          const freeHistory = free.find((item) => item.key === 'server_history');
          const freeResearch = free.find((item) => item.key === 'web_research');
          const topResearch = top.find((item) => item.key === 'web_research');
          if (!freeHistory?.usable) throw new Error('Free server history must remain usable.');
          if (freeResearch?.entitled) throw new Error('Free research must not be entitled yet.');
          if (!topResearch?.entitled || topResearch?.available || topResearch?.usable) {
            throw new Error('TOP research should be entitled but explicitly not live yet.');
          }
          const overridden = e.buildCapabilityAccess({
            planTier: 'free',
            overrides: [{ entitlement_key: 'web_research', enabled: true }]
          }).find((item) => item.key === 'web_research');
          if (!overridden?.entitled || overridden?.usable) {
            throw new Error('Override should grant entitlement without pretending the feature is live.');
          }
          console.log('Entitlement behavior verified.');
          NODE
      - name: Validate server wiring
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_subscriptions' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS account_entitlement_overrides' app/server.js
          grep -q '"/api/account/access"' app/server.js
          grep -q 'requireCapability("server_history")' app/server.js
          grep -q 'commercial: databaseReady ? "entitlements-ready"' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit migrated source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js
          if git diff --cached --quiet; then
            echo "No source migration changes to commit."
            exit 0
          fi
          git commit -m "Add commercial entitlement and subscription foundation"
          git push
