name: Age verification foundation v0.11

on:
  push:
    branches:
      - age-verification-foundation-v0.11

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply age verification migration
        run: python scripts/migrate-age-verification-foundation.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/age/gateway.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/admin.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('admin script block missing')
          Path('/tmp/unbound-admin.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-admin.js
      - name: Verify age gateway contract
        run: |
          node - <<'NODE'
          const age = require('./app/age/gateway');
          const blank = age.getAgeVerificationGatewayStatus({});
          if (blank.configured || blank.state !== 'provider-not-selected') process.exit(1);
          if (blank.storesRawIdentityEvidence || blank.storesBiometricTemplates) process.exit(1);
          const selected = age.getAgeVerificationGatewayStatus({ AGE_VERIFICATION_PROVIDER: 'future-provider' });
          if (selected.configured || selected.state !== 'adapter-not-installed') process.exit(1);
          if (!age.ageVerificationAllowsAdultAccess('verified')) process.exit(1);
          if (age.ageVerificationAllowsAdultAccess('pending')) process.exit(1);
          if (age.ageVerificationAllowsAdultAccess('verified', '2000-01-01T00:00:00Z')) process.exit(1);
          if (age.normalizeAgeVerificationStatus('nonsense') !== 'unverified') process.exit(1);
          console.log('Age verification gateway contract OK');
          NODE
      - name: Verify minimal-retention persistence
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_age_verification' app/server.js
          grep -q 'provider_reference_hash TEXT' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS age_verification_events' app/server.js
          grep -q 'payload_sha256 TEXT NOT NULL' app/server.js
          if grep -Eiq 'document_image|face_scan|fingerprint|biometric_template|birth_date|date_of_birth' app/server.js; then
            echo 'Raw identity/biometric storage field detected.'
            exit 1
          fi
      - name: Verify server-side adult gate and visibility
        run: |
          grep -q 'assertAgeVerifiedAdult' app/server.js
          grep -q 'requireAgeVerifiedAdult' app/server.js
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q '"/api/admin/age-verification/summary"' app/server.js
          grep -q 'ageVerification: getAgeVerificationGatewayStatus()' app/server.js
          grep -q 'id="ageAdapter"' app/admin.html
          grep -q 'loadAgeVerification' app/admin.html
      - name: Verify existing commercial and security features survived
        run: |
          grep -q '"/api/admin/billing/summary"' app/server.js
          grep -q '"/api/admin/users/:id/entitlements/:key"' app/server.js
          grep -q '"/api/account/security"' app/server.js
          grep -q '"/api/account/password"' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/admin.html app/age/gateway.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add hard age verification foundation"
          git push
