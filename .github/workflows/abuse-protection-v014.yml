name: Abuse protection v0.14

on:
  push:
    branches:
      - abuse-protection-v0.14

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply abuse-protection migrations
        run: |
          python scripts/migrate-abuse-protection-server-v014.py
          python scripts/migrate-abuse-protection-admin-v014.py
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/rate-limit.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/admin.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('admin script block missing')
          Path('/tmp/unbound-admin.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-admin.js
      - name: Verify configurable policy module
        run: |
          node - <<'NODE'
          const rate = require('./app/security/rate-limit');
          const defaults = rate.getRateLimitPolicy({});
          if (defaults.login.limit !== 12 || defaults.login.windowSeconds !== 900) process.exit(1);
          if (defaults.guestChat.limit !== 60 || defaults.accountChat.limit !== 300) process.exit(1);
          const custom = rate.getRateLimitPolicy({
            RATE_LIMIT_LOGIN_PER_15_MIN: '20',
            RATE_LIMIT_ACCOUNT_CHAT_PER_HOUR: '500'
          });
          if (custom.login.limit !== 20 || custom.accountChat.limit !== 500) process.exit(1);
          const a = rate.hashRateLimitSubject('secret', 'same');
          const b = rate.hashRateLimitSubject('secret', 'same');
          const c = rate.hashRateLimitSubject('secret', 'different');
          if (a !== b || a === c || a.length !== 64) process.exit(1);
          const status = rate.getRateLimitStatus({});
          if (status.rawIpStored !== false || status.storage !== 'postgresql') process.exit(1);
          console.log('Rate-limit policy contract OK');
          NODE
      - name: Verify PostgreSQL counters and privacy boundary
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS rate_limit_buckets' app/server.js
          grep -q 'CREATE TABLE IF NOT EXISTS rate_limit_blocks' app/server.js
          grep -q 'ON CONFLICT (scope, subject_hash)' app/server.js
          grep -q 'hashRateLimitSubject' app/server.js
          grep -q 'GUEST_RATE_COOKIE = "unbound_guest_rate"' app/server.js
          grep -q 'HttpOnly; Path=/; SameSite=Lax' app/server.js
          grep -q "DELETE FROM rate_limit_buckets" app/server.js
          if grep -Eiq 'ip_address|remote_addr|client_ip|last_ip' app/server.js; then
            echo 'Raw IP persistence field detected.'
            exit 1
          fi
      - name: Verify protected routes
        run: |
          grep -q 'registerRateLimit, async (req, res)' app/server.js
          grep -q 'loginRateLimit, async (req, res)' app/server.js
          grep -q 'app.post("/api/chat", chatRateLimit, researchRateLimit' app/server.js
          grep -q 'app.post("/api/chat/stream", chatRateLimit' app/server.js
          test "$(grep -c 'securityActionRateLimit,' app/server.js)" -ge 5
          grep -q 'res.status(429)' app/server.js
          grep -q 'Retry-After' app/server.js
      - name: Verify admin abuse-protection visibility
        run: |
          grep -q '"/api/admin/rate-limits/summary"' app/server.js
          grep -q 'id="refreshAbuseProtection"' app/admin.html
          grep -q 'id="rateLimitBody"' app/admin.html
          grep -q 'loadAbuseProtection' app/admin.html
          grep -q 'Safety ceilings are environment-configurable and are not commercial plan quotas' app/admin.html
      - name: Verify previous security and product features survived
        run: |
          grep -q '"/api/account/security/events"' app/server.js
          grep -q '"/api/admin/security/summary"' app/server.js
          grep -q '"/api/account/devices/:id/revoke"' app/server.js
          grep -q '"/api/account/age-verification"' app/server.js
          grep -q '"/api/admin/billing/summary"' app/server.js
          grep -q 'RESEARCH_MODE_PROMPT' app/server.js
          grep -q 'deleteAccountModal' app/index.html
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/admin.html app/security/rate-limit.js
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "Add PostgreSQL abuse protection and rate limits"
          git push
