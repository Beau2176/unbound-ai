name: Integrate and validate Research Mode

on:
  push:
    branches:
      - feature-research-mode-sync
    paths:
      - .research-integration/trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Preserve validated Research UI on latest main baseline
        run: |
          git fetch origin feature-research-mode
          git checkout origin/feature-research-mode -- app/index.html app/admin.html
      - name: Integrate Research Mode into provider gateway
        run: python3 .research-integration/integrate.py
      - name: Install exact dependencies
        working-directory: app
        run: npm ci
      - name: Check server and provider syntax
        run: |
          node --check app/server.js
          node --check app/ai/gateway.js
          node --check app/ai/providers/openai.js
      - name: Check browser JavaScript syntax
        working-directory: app
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
            for (const [i, code] of blocks.entries()) {
              try { new Function(code); }
              catch (error) { console.error(`${file} script ${i + 1}:`, error); process.exit(1); }
            }
          }
          console.log('Browser JavaScript syntax OK.');
          NODE
      - name: Verify provider-neutral Research Mode wiring
        run: |
          grep -q 'research: providerSupportsResearch(provider)' app/ai/gateway.js
          grep -q 'type: "web_search"' app/ai/providers/openai.js
          grep -q 'web_search_call.action.sources' app/ai/providers/openai.js
          grep -q 'productMode === "research"' app/server.js
          grep -q 'web_search_calls' app/server.js
          grep -q 'data-product-mode="research"' app/index.html
          grep -q 'class="inline-citation"' app/index.html
          git diff --check
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit validated integration
        run: |
          git config user.name "UNBOUND Research Integrator"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html app/admin.html app/ai/gateway.js app/ai/providers/openai.js
          git commit -m "Integrate Research Mode with provider-neutral AI gateway"
          git push
