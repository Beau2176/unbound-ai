name: DB Startup Resilience v0.29

on:
  push:
    branches:
      - db-startup-resilience-v0.29

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply database resilience migration
        run: python scripts/migrate-db-startup-resilience-v029.py

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Run permanent CI checks
        working-directory: app
        run: npm run ci

      - name: Verify database resilience policy
        working-directory: app
        run: |
          node - <<'NODE'
          const {
            getDatabaseResilienceConfig,
            databaseRetryDelay
          } = require('./ops/database-resilience');

          const defaults = getDatabaseResilienceConfig({});
          if (defaults.connectionTimeoutMillis !== 10000) throw new Error('Connection timeout default changed');
          if (defaults.statementTimeoutMillis !== 45000) throw new Error('Statement timeout default changed');
          if (defaults.queryTimeoutMillis !== 50000) throw new Error('Query timeout default changed');
          if (defaults.lockTimeoutMillis !== 15000) throw new Error('Lock timeout default changed');

          const expected = [2000, 4000, 8000, 16000, 30000, 30000, 30000];
          expected.forEach((delay, index) => {
            const actual = databaseRetryDelay(index + 1, defaults);
            if (actual !== delay) throw new Error(`Retry delay ${index + 1}: expected ${delay}, got ${actual}`);
          });

          const bounded = getDatabaseResilienceConfig({
            UNBOUND_DB_CONNECTION_TIMEOUT_MS: '10',
            UNBOUND_DB_QUERY_TIMEOUT_MS: '999999',
            UNBOUND_DB_RETRY_BASE_MS: '50',
            UNBOUND_DB_RETRY_MAX_MS: '999999'
          });
          if (bounded.connectionTimeoutMillis !== 1000) throw new Error('Connection timeout lower bound failed');
          if (bounded.queryTimeoutMillis !== 190000) throw new Error('Query timeout upper bound failed');
          if (bounded.retryBaseMillis !== 500) throw new Error('Retry base lower bound failed');
          if (bounded.retryMaxMillis !== 120000) throw new Error('Retry max upper bound failed');

          console.log('Database resilience policy OK');
          NODE

      - name: Verify v0.29 server contract
        run: |
          grep -q 'nextPool.on("error"' app/server.js
          grep -q 'statement_timeout: DATABASE_RESILIENCE.statementTimeoutMillis' app/server.js
          grep -q 'query_timeout: DATABASE_RESILIENCE.queryTimeoutMillis' app/server.js
          grep -q 'lock_timeout: DATABASE_RESILIENCE.lockTimeoutMillis' app/server.js
          grep -q 'keepAlive: true' app/server.js
          grep -q 'await pool.query("SELECT 1")' app/server.js
          grep -q 'scheduleDatabaseInitialization("initialization-failure")' app/server.js
          grep -q 'void initializeDatabaseWithRetry()' app/server.js

      - name: Commit completed v0.29 and remove one-time migration
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/ops/database-resilience.js
          git rm scripts/migrate-db-startup-resilience-v029.py .github/workflows/db-startup-resilience-v029.yml
          git commit -m "Harden database startup resilience v0.29"
          git push origin HEAD:db-startup-resilience-v0.29
