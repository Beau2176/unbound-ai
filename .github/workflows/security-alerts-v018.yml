name: Security Alerts v0.18

on:
  push:
    branches:
      - security-alerts-v0.18

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply security-alert migrations
        run: |
          python scripts/migrate-security-alerts-server-v018.py
          python scripts/migrate-security-alerts-index-v018.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/alerts.js
          node --check app/security/recovery.js
          node --check app/security/passkeys.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify security-alert primitive contract
        working-directory: app
        run: |
          node - <<'NODE'
          const alerts = require('./security/alerts');
          const normal = alerts.buildNewDeviceAlert({ label: 'Chrome on Windows', authMethod: 'password' });
          const revoked = alerts.buildNewDeviceAlert({ label: 'Chrome on Windows', authMethod: 'password', replacedRevokedDevice: true });
          if (normal.eventType !== 'device.new_sign_in' || normal.severity !== 'warning') process.exit(1);
          if (revoked.eventType !== 'device.revoked_token_reused' || revoked.severity !== 'critical') process.exit(1);
          const status = alerts.getSecurityAlertStatus();
          if (status.storage !== 'postgresql' || status.delivery !== 'in-app' || status.rawIpStored !== false) process.exit(1);
          console.log('Security alert primitive contract OK');
          NODE
      - name: Verify server alert wiring and revoked-device behavior
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS account_security_alerts' app/server.js
          grep -q 'account_security_alerts_user_unread_idx' app/server.js
          grep -q 'writeSecurityAlert' app/server.js
          grep -q 'buildNewDeviceAlert' app/server.js
          grep -q 'device.revoked_token_replaced' app/server.js
          grep -q 'replacedRevokedDeviceId' app/server.js
          grep -q '"/api/account/security/alerts"' app/server.js
          grep -q '"/api/account/security/alerts/:alertId/acknowledge"' app/server.js
          grep -q '"/api/account/security/alerts/acknowledge-all"' app/server.js
          grep -q 'securityAlerts: getSecurityAlertStatus()' app/server.js
          grep -q 'notifyNewDevice: false' app/server.js
          grep -q 'authMethod: "passkey"' app/server.js
          if grep -A18 'async function ensureDeviceForRequest' app/server.js | grep -q 'revoked_at = NULL'; then
            echo 'Revoked device tokens must not be silently reactivated.'
            exit 1
          fi
      - name: Verify alert UI
        run: |
          grep -q 'id="securityAlertList"' app/index.html
          grep -q 'MARK ALL READ' app/index.html
          grep -q 'loadSecurityAlerts' app/index.html
          grep -q 'refreshSecurityAlertBadge' app/index.html
          grep -q 'handleAcknowledgeAllSecurityAlerts' app/index.html
          grep -q 'SECURITY (' app/index.html
      - name: Verify earlier security layers survived
        run: |
          grep -q 'account_recovery_codes' app/server.js
          grep -q '"/api/auth/recovery-code/reset"' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'passkey_challenges' app/server.js
          grep -q 'account_devices' app/server.js
          grep -q 'account_security_events' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'rate_limit_buckets' app/server.js
          grep -q 'getAgeVerificationGatewayStatus' app/server.js
          grep -q 'getBillingGatewayStatus' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add persistent new-device security alerts"
            git push origin HEAD:security-alerts-v0.18
          fi
