name: Account Access latest-main sync

on:
  push:
    branches:
      - account-access-v0.8.1-sync2

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Apply latest-main sync
        run: python scripts/sync-account-access-latest.py
      - name: Validate server JavaScript
        run: |
          node --check app/server.js
          node --check app/access/entitlements.js
      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start: raise SystemExit('script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify Access Research and deletion coexist
        run: |
          grep -q 'id="accessButton"' app/index.html
          grep -q 'id="accessModal"' app/index.html
          grep -q 'id="deleteAccountModal"' app/index.html
          grep -q 'handleDeleteAccount' app/index.html
          grep -q 'chooseResearchMode' app/index.html
          grep -q 'productMode: canUseCapability("web_research")' app/index.html
          grep -q 'assertRequestCapability(req, "web_research")' app/server.js
          grep -q 'app.delete(' app/server.js
          grep -q '"/api/account"' app/server.js
          grep -q 'const RESEARCH_MODE_PROMPT' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
      - name: Commit synced production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Merge Account Access controls with account deletion"
          git push
