name: Sign-In Risk v0.19

on:
  push:
    branches:
      - signin-risk-v0.19

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply sign-in risk migrations
        run: |
          python scripts/migrate-signin-risk-server-v019.py
          python scripts/migrate-signin-risk-index-v019.py
      - name: Install production dependencies
        working-directory: app
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check app/server.js
          node --check app/security/signin-risk.js
          node --check app/security/alerts.js
          python - <<'PY'
          from pathlib import Path
          html = Path('app/index.html').read_text()
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('index script block missing')
          Path('/tmp/unbound-index.js').write_text(html[start + len('<script>'):end])
          PY
          node --check /tmp/unbound-index.js
      - name: Verify sign-in risk primitive contract
        working-directory: app
        run: |
          node - <<'NODE'
          const risk = require('./security/signin-risk');
          const cfg = risk.getSignInRiskConfig({
            SECURITY_FAILED_LOGIN_ALERT_THRESHOLD: '4',
            SECURITY_FAILED_LOGIN_ALERT_WINDOW_MINUTES: '20'
          });
          if (cfg.failedPasswordThreshold !== 4 || cfg.failedPasswordWindowMinutes !== 20) process.exit(1);
          const alert = risk.buildRepeatedFailureAlert({ count: 4, windowMinutes: 20 });
          if (alert.eventType !== 'auth.repeated_failed_sign_in' || alert.severity !== 'warning') process.exit(1);
          const status = risk.getSignInRiskStatus();
          if (status.rawIpStored !== false || status.source !== 'account-security-events') process.exit(1);
          console.log('Sign-in risk primitive contract OK');
          NODE
      - name: Verify server sign-in risk wiring
        run: |
          grep -q 'recordFailedPasswordSignIn' app/server.js
          grep -q 'auth.password_failed' app/server.js
          grep -q 'auth.password_signed_in' app/server.js
          grep -q 'auth.repeated_failed_sign_in' app/server.js
          grep -q 'pg_advisory_xact_lock' app/server.js
          grep -q 'failedPasswordThreshold' app/server.js
          grep -q 'signInRisk: getSignInRiskStatus()' app/server.js
          grep -q 'FAILED SIGN-IN SECURITY LOG ERROR' app/server.js
          if grep -Eq '(ip_address|remote_addr|client_ip)[[:space:]]' app/server.js app/security/signin-risk.js; then
            echo 'Raw IP persistence field detected.'
            exit 1
          fi
      - name: Verify user security activity labels
        run: |
          grep -q 'auth.password_failed.*Failed password sign-in' app/index.html
          grep -q 'auth.password_signed_in.*Password sign-in' app/index.html
      - name: Verify v0.18 and earlier security layers survived
        run: |
          grep -q 'account_security_alerts' app/server.js
          grep -q 'device.revoked_token_replaced' app/server.js
          grep -q 'account_recovery_codes' app/server.js
          grep -q 'account_passkeys' app/server.js
          grep -q 'createSameOriginApiGuard' app/server.js
          grep -q 'rate_limit_buckets' app/server.js
          grep -q 'getAgeVerificationGatewayStatus' app/server.js
          grep -q 'getBillingGatewayStatus' app/server.js
      - name: Dependency audit
        working-directory: app
        run: npm audit --audit-level=moderate
      - name: Commit production source
        run: |
          git config user.name "UNBOUND Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/server.js app/index.html
          if git diff --cached --quiet; then
            echo "No generated production changes to commit."
          else
            git commit -m "Add repeated failed sign-in risk monitoring"
            git push origin HEAD:signin-risk-v0.19
          fi
