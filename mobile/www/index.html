<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>UNBOUND AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: min(440px, 100%); text-align: center; }
    .mark { font-size: clamp(42px, 14vw, 72px); line-height: 1; margin-bottom: 18px; }
    h1 { margin: 0; letter-spacing: .14em; font-size: clamp(26px, 8vw, 38px); }
    p { margin: 12px 0 0; color: #b8c0cc; font-size: 15px; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="mark" aria-hidden="true">∞</div>
    <h1>UNBOUND AI</h1>
    <p>A more open tomorrow starts today.</p>
  </main>
</body>
</html>
