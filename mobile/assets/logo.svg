<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brandStroke" x1="150" y1="512" x2="874" y2="512" gradientUnits="userSpaceOnUse">
