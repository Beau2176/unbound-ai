      <stop offset="0.25" stop-color="#42b8ff"/>
      <stop offset="0.48" stop-color="#dff7ff"/>
      <stop offset="0.52" stop-color="#fff4d5"/>
      <stop offset="0.75" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e67a21"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
